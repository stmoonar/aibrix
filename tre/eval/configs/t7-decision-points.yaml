# Pre-registered decision points of trace T7 Tight-pool (docs/trace-design-v2, round 2):
# max-min per-replica load. On the 8b surge the right donor is 14b (2 -> 1, worst 1.0), not 7b
# (worst 1.2) and not "no move" (worst 1.3). On the 14b surge the right answer is no move.
applies_to: "(?i)T7|tight"
decision_points:
  - name: "T7 8b surge: donor"
    surge_model: dsllama-8b
    expect: {donor: dsqwen-14b}
  - name: "T7 14b surge: no move"
    surge_model: dsqwen-14b
    expect: {no_move: true}
