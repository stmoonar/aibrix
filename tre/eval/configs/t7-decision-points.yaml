# Pre-registered decision points of trace Tight_pool (the 720 s successor of T7_tight_pool;
# tre/docs/design/20261026-traces-720.md). Base 2/2/2 fills the pool; the 8b and 7b surges are an
# integer overload (replicas needed at V_slo 9 > 8): the right answer is to sacrifice 14b (the
# receiver takes 14b's two GPUs, 14b 2 -> 1), not to take from the other TP1 model and not to
# stay put - checked by the generator's audit (R8) with a fluid queue on both V_req and the
# worst model's violated fraction. On the 14b surge the need is exactly 8: nobody moves.
# The file name is kept so campaign files that name it keep working; applies_to still matches
# the old T7_tight_pool runs.
applies_to: "(?i)T7|tight"
decision_points:
  - name: "Tight_pool 8b surge: donor"
    surge_model: dsllama-8b
    expect: {donor: dsqwen-14b}
  - name: "Tight_pool 7b surge: donor"
    surge_model: dsqwen-7b
    expect: {donor: dsqwen-14b}
  - name: "Tight_pool 14b surge: no move"
    surge_model: dsqwen-14b
    expect: {no_move: true}
