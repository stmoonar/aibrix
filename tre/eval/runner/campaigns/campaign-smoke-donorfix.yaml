# NOTE: results_root, trace_root, trace_host_root and the other absolute paths below are site-specific; edit them for another cluster.
# Smoke of the donor-evidence controller fix before campaign-seeds-alt-donorfix.yaml: TRE only, V_slo trace
# set, T7 Tight-pool seed1 [100, 220) s (base load + the start of the 8b surge at 120 s). Acceptance: valid;
# no HIGH donor transfer with sleep_path urgent; SafeScale donor probes and their outcomes recorded; no SM 409
# slot_occupied. Same marker round as the final campaign.
#
#   tre/eval/runner/run_campaign.sh tre/eval/runner/campaigns/campaign-smoke-donorfix.yaml --dry-run --probe
#   nohup tre/eval/runner/run_campaign.sh tre/eval/runner/campaigns/campaign-smoke-donorfix.yaml > /data/nfs_shared_data/xxy/e1-smoke-donorfix-20261008.out 2>&1 &
name: e1-smoke-donorfix-20261008
round: e1-final-vslo-20261008
results_root: /data/nfs_shared_data/xxy/e1-smoke-donorfix-20261008
trace_root: /data/nfs_shared_data/xxy/traces-v2-vslo-20261007
loadgen_config_root: ${TRE_REPO}/loadgen_v1/configs/traces_v2
seed: 1
arms: [tre]
order: williams
max_attempts: 2
eta: {overhead_s: 300, report_s: 60}

env:
  RELEASE_TRE: ${TRE_REPO}   # one tree: scripts, baselines and client all come from the tree the runner runs from
  TRE_DIR: ${RELEASE_TRE}
  BL_CM_FILE: ${RELEASE_TRE}/deploy/baselines/tre/policy-configmaps.yaml
  BL_CM_APPLY: "1"
  LOADGEN_TRE_DIR: ${TRE_REPO}
  GW_PARITY: "1"
  BL_SEED: "0"
  IGNORE_EOS: "1"

preserve:
  trace_host_root: /data/nfs_shared_data/xxy/baseline-traces
  trace_pod_root: /etc/tre-baselines-traces
  match_parts: 3

report:
  enabled: true
  per_arm: true
  capacity: ${TRE_REPO}/eval/configs/capacity-v030-vslo-20261007.yaml
  decision_points: ${TRE_REPO}/eval/configs/t7-decision-points.yaml
  ref: tre
  reps: 200
  timeout_s: 600
  nice: 10

precheck:
  disk_min_free_gb: {nfs: 50, nodes: {nscc-ds-4a100-node9: 8}}

traces:
  - trace: T7_tight_pool
    slice: {start_s: 100, duration_s: 120}   # base load + the start of the 8b surge at 120 s
