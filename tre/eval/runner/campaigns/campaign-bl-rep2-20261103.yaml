# [repo] Repo copy of the campaign spec as it was run. The only change is the path parameter: the site data root
# [repo] (results roots, trace sets, baseline-trace history) is ${CAMPAIGN_DATA_ROOT}; set it before running or dry-running.
# [repo] Drop the '# [repo]' lines and put the site root back and you get the original byte for byte
# [repo] (tre/eval/runner/drivers/originals.tsv; tre/eval/tests/test_repro_assets_20261103.py checks it).
# [repo] Site-specific and NOT parameterised (YAML keys are not expanded): the node name under precheck.disk_min_free_gb.nodes.
# 2026-11-03 baselines rep 2: APA / TokenScale / PreServe again on the 7 tune-F ICSE evaluation traces (no TRE arm), seed 1.
# PURPOSE: a second, independent sample of the three baselines on the SAME trace files as the first sample
# (docs/tre-tuneF-results-20261101.md sec 3 and 7): run-to-run variance of the baselines, and a second sample for the
# comparison. The TRE arm is NOT run (its parameters may change after a calibration refit); the baselines read no
# TRE parameter: the baseline shell reads from the registry only per-model min / max_awake replicas, tp_size, vLLM
# args (max-num-seqs), slo.ttft_p95_ms / tpot_p95_ms and service_manager.*, none of the trs.* / alt_thresholds.* values.
# Runner / client / images: main d17bccea (pushed); SM 20261029-d9fa1571, gateway 20261029-8b60253f-nozmq2,
# baseline-scaler 20261029-8b60253f (the images of the first sample); the controller (observe mode) is whatever is live.
#
# FIRST SAMPLE of each trace (arms apa / tokenscale / preserve) and the trace file replayed now (traces_tre.effective.json):
#   Alternating_hot_model_periodic_A   r3c k1.65      traces-icse-r3c-20261101       campaign-icse-r3c-full-D-20261101-run
#       trace sha256 574ab1b5eb03fdb76c991fe3efb99b2476d0df32a8b7c1a6dade2c798cd1bbbf
#   Simultaneous_spike_ramp_twice_tps1 r3c k1.325     traces-icse-r3c-20261101       campaign-icse-r3c-full-D-20261101-run
#       trace sha256 6a2ce8f782b82a6a0daa938aa8aa3e245525c3a8caf3c3f9d9755d31be8c4d93
#   Prefill_mixed_corner_decode_mix    r3c k1.7       traces-icse-r3c-20261101       campaign-icse-r3c-full-D-20261101-run
#       trace sha256 91821e6f5d92660566e252cf7086a6ed4712d542fbefa8fbcec844bf2ff8c42e
#   Decode_heavy_burst                 ktrace x1.2    traces-icse-ktrace-20261031    campaign-icse-ktrace-20261031-run
#       trace sha256 f4ed951263fc94f14aef18355c6699671c7a261cfebf9b89e9f13b5f0ae05929
#   Sinusoidal_demand                  ktrace x1.3    traces-icse-ktrace-20261031    campaign-icse-ktrace-20261031-run
#       trace sha256 5e1e3233bd0abf319a6be545fd08edd64e39964342de3a5b16a0b44fbbbc10ab
#   Real_conv_2023_slice_a_tok70       v1 x1          traces-icse-20261030           campaign-icse-bl-20261030
#       trace sha256 4f8ce83471ea39034b3b2d2aa677a56ea99e036854a734b936f30ecd20de8ca7
#   Real_code_2024_slice_a_tok70       ktrace x1.6    traces-icse-ktrace-20261031    campaign-icse-ktrace-20261031-run
#       trace sha256 b115e279de7c6eda4ac0c65fcd2bdfdac677a75b3ea24c0298202d23a35c4e72
#   per-arm manifest facts of the first sample: source_runs.tsv next to this file.
#
# DIFFERENCES to the source specs (campaign-icse-r3c-full-D-20261101, campaign-icse-ktrace-20261031,
# campaign-icse-bl-20261030):
#   - arms = [preserve, tokenscale, apa]; no tre arm, arm_defs.tre dropped (arm_defs.preserve copied);
#   - name / round / results_root are new; ONE spec for traces of three trace sets: per-trace `dir:` instead of
#     one trace_root (the runner supports it; trace files, loadgen configs and preserve_history.json are the
#     files of the first sample, sha256 above);
#   - report.enabled false (project rule 11-02), report.ref apa;
#   - registry_expect dropped: the three sources pinned three different TRE registries (ee37.., 5028.., af9a..)
#     and the runner demands a registry_id inside registry_expect; the driver checks the baseline-relevant part
#     of the registry instead (registry_guard.py); every arm records registry_sha256 + live-registry.yaml;
#   - eta.overhead_s 280 -> 190 (planning / marker length only; measured on the first sample, see sec ETA);
#   - arm order = Williams square over 3 arms, traces in file order (r3c first).
#   Everything else (env, preserve, precheck, validity, marker, max_attempts, gap_s, seed, order method) is copied.
#
# ETA: first-sample baseline arms wall 936.8 s on average (min 915, max 996, n=20 valid) = 720 s trace + 217 s;
#   runner fastpath (C2 / C3, smoke 11-02) -33 s; reports off; ~6 s between arms -> ~910 s per arm
#   -> 21 arms ~5.3 h (+ first pre-check / reset 2-10 min; +17 min per retried arm).
#
#   bash tre/eval/runner/run_campaign.sh {this file} --dry-run          (no cluster access; output in dryrun*.txt)
#   bash ${CAMPAIGN_DATA_ROOT}/campaign-bl-rep2-20261103/run_campaign-bl-rep2-20261103.sh --check   (read-only guards)
#   python3 tre/eval/runner/first_run_check.py <results_root>/<trace>_s1/<arm>      # after run 1, then every 50 min
name: campaign-bl-rep2-20261103
round: campaign-bl-rep2-20261103
results_root: ${CAMPAIGN_DATA_ROOT}/campaign-bl-rep2-20261103-run
loadgen_config_root: ${TRE_REPO}/loadgen_v1/configs/traces_v14
seed: 1
arms: [preserve, tokenscale, apa]   # first run = PreServe (P0 + drain + oracle copy are checked first), as in campaign-icse-bl-20261030
order: williams
max_attempts: 2
gap_s: 0
eta: {overhead_s: 190, report_s: 150}

env:
  RELEASE_TRE: ${TRE_REPO}
  TRE_DIR: ${RELEASE_TRE}
  BL_CM_FILE: ${RELEASE_TRE}/deploy/baselines/tre/policy-configmaps.yaml
  BL_CM_APPLY: "1"
  LOADGEN_TRE_DIR: ${TRE_REPO}
  GW_PARITY: "1"
  GW_EVENTS_KEEP: "1"
  BL_SEED: "0"
  IGNORE_EOS: "1"
  PROBE_WAIT_S: "300"
  RUN_CHECK_CONTROLLER_TICK_S: "5"
  RUN_CHECK_BASELINE_TICK_S: "5"
  RUN_CHECK_COVERAGE_MIN: "0.9"
  RUN_CHECK_FROZEN_MAX: "0.05"

arm_defs:
  preserve:
    base: preserve
    label: PreServe                 # faithful (mLSTM, load errors), drain on
    policy: {tier1: mlstm}          # history: preserve_history.json next to each trace (causal, real Azure segments)

preserve:
  trace_host_root: ${CAMPAIGN_DATA_ROOT}/baseline-traces
  trace_pod_root: /etc/tre-baselines-traces
  match_parts: 3

report:
  enabled: false                    # project rule 2026-11-02: no reports while a campaign runs (viz.sh afterwards)
  per_arm: true
  capacity: ${TRE_REPO}/eval/configs/capacity-v030-vslo-20261007.yaml
  ref: apa
  reps: 1000
  timeout_s: 1200
  nice: 10

precheck:
  gpu_truth_max_age_s: 30
  breakpoint_lookback_s: 60
  wait_s: 300
  poll_s: 30
  disk_min_free_gb:
    nfs: 50
    nodes: {nscc-ds-4a100-node9: 8}

validity:
  fail_frac_suspect: 0.01
  fail_frac_invalid: 0.20
  sent_frac_min: 0.98
  emfile: invalid
  max_tokens_hit_min: 0.99
  clock_drift_max_s: 1.0

marker: {extend: true, margin_s: 1800}

# first in the file = first to run; per-trace dir = <trace set>/<trace>/seed1 (traces_tre.effective.json, manifest.json,
# preserve_history.json; no pre_t0.json)
traces:
  - trace: Alternating_hot_model_periodic_A
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-r3c-20261101/Alternating_hot_model_periodic_A/seed1
    # Alternating r3c k1.65; sha256 574ab1b5eb03fdb76c991fe3efb99b2476d0df32a8b7c1a6dade2c798cd1bbbf
  - trace: Simultaneous_spike_ramp_twice_tps1o2
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-r3c-20261101/Simultaneous_spike_ramp_twice_tps1o2/seed1
    # Simultaneous r3c k1.325; sha256 6a2ce8f782b82a6a0daa938aa8aa3e245525c3a8caf3c3f9d9755d31be8c4d93
  - trace: Prefill_mixed_corner_decode_mix
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-r3c-20261101/Prefill_mixed_corner_decode_mix/seed1
    # Prefill_mixed r3c k1.7; sha256 91821e6f5d92660566e252cf7086a6ed4712d542fbefa8fbcec844bf2ff8c42e
  - trace: Decode_heavy_burst
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-ktrace-20261031/Decode_heavy_burst/seed1
    # Decode_heavy ktrace x1.2; sha256 f4ed951263fc94f14aef18355c6699671c7a261cfebf9b89e9f13b5f0ae05929
  - trace: Sinusoidal_demand
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-ktrace-20261031/Sinusoidal_demand/seed1
    # Sinusoidal ktrace x1.3; sha256 5e1e3233bd0abf319a6be545fd08edd64e39964342de3a5b16a0b44fbbbc10ab
  - trace: Real_conv_2023_slice_a_tok70
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-20261030/Real_conv_2023_slice_a_tok70/seed1
    # Real_conv v1 x1; sha256 4f8ce83471ea39034b3b2d2aa677a56ea99e036854a734b936f30ecd20de8ca7
  - trace: Real_code_2024_slice_a_tok70
    dir: ${CAMPAIGN_DATA_ROOT}/traces-icse-ktrace-20261031/Real_code_2024_slice_a_tok70/seed1
    # Real_code ktrace x1.6; sha256 b115e279de7c6eda4ac0c65fcd2bdfdac677a75b3ea24c0298202d23a35c4e72
