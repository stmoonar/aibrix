  env:
    VLLM_SERVER_DEV_MODE: '1'
    VLLM_WORKER_MULTIPROC_METHOD: spawn
    HF_HUB_OFFLINE: '1'
    VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '75'
gateway:
  route_timeout_s: 150
  service_name: tre-gateway
  service_namespace: envoy-gateway-system
  service_port: 80
  upstream_idle_timeout_s: 60
reissue:
  enabled: true
  gateway_url: null
  vllm_port: 8001
  max_depth: 3
  retry_attempts: 4
  image: null
  cpu_request: 50m
  cpu_limit: '2'
  memory_request: 64Mi
  memory_limit: 1Gi
service_manager:
  writer_lock_wait_s: 30
  commit_lock_wait_s: null
  k8s_request_timeout_s: 5
  api_call_timeout_s: 360
  log_level: INFO
  replica_floor:
    enforce: true
    log_interval_s: 60
  startup_admission:
    gate_seen_s: 30
    drift_grace_s: 600
  sleep:
    ack_timeout_s: 5
    instance_staleness_s: 10
    gateway_min_instances: 1
    fallback_no_plugin: false
    no_plugin_grace_s: 5
    poll_interval_s: 0.5
    sleep_call_timeout_s: 20
    probe_timeout_s: 5
    io_margin_s: 2
    physical_confirm_timeout_s: 8
    vllm_sleep_mode_param: auto
    sleep_mode_when_idle: abort
    hard_cap_s: null
    reservation_ttl_s: 40
    gateway_plugin_pods:
      namespace: tre-v2
      label_selector: app=tre-gateway-plugins
    budgets_s:
      safescale_commit: null
      urgent: 30
      scale_down: null
      defrag: 30
      repair: 30
      startup: 30
      default: 30
    no_drain_paths:
    - safescale_commit
    - urgent
    - scale_down
    - apa
    - defrag
    - repair
    - startup
    - default
  wake:
    call_timeout_s: 10
    max_used_fraction: 0.2
    max_used_mib: null
    truth_wait_s: 10
  create:
    margin_mib: 512
    max_used_mib: null
  clock_skew:
    warn_s: 1.0
    fail_s: null
  node_pressure:
    registry_nodes_only: true
safescale:
  slo_mode: fixed
  window_ceiling_s: 60
  min_commit_samples: 20
  evidence_clock_tolerance_s: 20
  evidence_source: direct
  evidence_poll_s: 2
  scrape_timeout_s: 1
  baseline_delay_ms: 1000
  metrics_port: 8000
  rollback_retry_z_margin: 0.25
  early_commit: true
scaling:
  rescue_max_step_ratio: 2.0
  rescue_max_step_pods: 4
  rescue_settle_ema_k: 2.0
  breakpoint_window: true
  onset_warmup_guard: false
  min_evidence_ms: 20000
  min_evidence_requests: 3
  breakpoint_margin_ms: 1000
  breakpoint_partial_max_step: 1
  breakpoint_lowevidence_requests: 10
  breakpoint_hold_max_ms: 50000
  gateway_clock_tolerance_ms: 2000
  gateway_clock_check_s: 60
  saturation_rescue: true
  saturation_kv_threshold: 0.9
  saturation_confirm_ms: 10000
  saturation_max_step_factor: 2
  sample_min_ratio: 0.9
gpu_truth:
  image: tre-v2-gpu-truth:20261001-8d8b2565
