models:
- name: dsqwen-7b
  weights_path: /data/nfs_shared_data/DeepSeek-R1-Distill-Qwen-7B
  tp_size: 1
  min_replicas: 1
  # max_replicas = GPU layout (bindings rendered by make manifests);
  # max_awake_replicas = scaling cap (TRE planner + SM + APA maxReplicas).
  max_replicas: 8
  max_awake_replicas: 4
  # vLLM 0.30 fork image (plan 2026-09-27 D9): upstream ced6857af + pinned_weights
  # sleep backend + sleep rollback fix + --sleep-reject-new / --abort-return-token-ids.
  # A new image invalidates the calibrated theta (D9: recalibrate after migrating).
  vllm_image: vllm-openai-tre:0.30.0-ts-02ad6c9e
  # Fork features of that image; their engine flags are rendered while reissue.enabled.
  vllm_features:
  - sleep_reject_new
  - abort_return_token_ids
  # null = vLLM default (cumem). Option: pinned_weights (fork backend: pinned host copy
  # kept for the process lifetime, sleep ~0.07 s but wake ~0.4 s slower, level 1 only).
  sleep_mode_backend: null
  slo:
    ttft_p95_ms: 500.0
    tpot_p95_ms: 75.0
    e2e_p95_ms: 12000.0
    # Idle TTFT(L) = c + b * prompt_tokens: the calibration label's slowdown TTFT SLO
    # is max(floor, k * idle); primary label k = 5, floor 500 ms (plan 2026-09-21 6.11 D6'). Offline label only; provenance
    # docs/refactor/p11_evidence/ttft_idle_fit_20260922.yaml
    ttft_idle_c_ms: 36.4
    ttft_idle_b_ms_per_token: 0.0527
    ttft_slo_mode: slowdown
    ttft_slowdown_k: 5.0
    ttft_floor_ms: 500.0
  alt_thresholds:
    queue_len:
      theta: 78.33333333333333
      direction: lower_is_healthier
    decode_tps:
      theta: 2218.6666666666665
      direction: lower_is_healthier
    prefill_tps:
      theta: 6081.666666666667
      direction: lower_is_healthier
  # theta_m/w_p/lambda_wait/tau_crit/tau_high: v1-lambda round 2 (2026-09-24), /data/nfs_shared_data/xxy/calibration_v1lambda_20260924/round2_wp0_d13_20/params_v1lambda_r2.json sha256 83d30b12...; identical to the live tre-v2-registry ConfigMap.
  trs:
    w_p: 0.0
    w_d: 1.0
    lambda_wait: 3.375
    qmin: 1.0
    ema_alpha: 0.2485
    theta_m: 538.8220633910997
    tau_crit: 0.56
    tau_low: 1.0
    tau_high: 2.11
    qsat: 4.0
    epsat: 0.05
    hsat: 3
    ema_tau_ms: 10000
  vllm_extra_args:
  - --no-enable-prefix-caching
  - --max-num-seqs
  - '256'
  - --enable-chunked-prefill
  - --max-num-batched-tokens
  - '2048'
  - --gpu-memory-utilization
  - '0.85'
  # --max-model-len; null = the model's maximum.
  max_model_len: null
