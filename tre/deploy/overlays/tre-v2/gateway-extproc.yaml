# ext_proc serving path of the isolated tre-v2 gateway (supersedes the "no ext-proc" part
# of ADR-0008; see docs/refactor/DECISIONS.md "ADR-0008 amendment: least-gpu-cache").
#
# v1 routed every request through the AIBrix gateway plugin (ext_proc), which picked the
# pod with the lowest vllm:gpu_cache_usage_perc (routing-strategy: least-gpu-cache) and
# Envoy forwarded to that IP through an ORIGINAL_DST cluster. This file rebuilds that path
# on tre-v2/tre-aibrix-eg (NodePort 31094) only. Every object is namespace-local to tre-v2;
# nothing in aibrix-system or the class-level EnvoyProxy/EnvoyGateway config is touched
# (EnvoyPatchPolicy is already enabled cluster-wide: envoy-gateway-config
# extensionApis.enableEnvoyPatchPolicy=true).
#
# Request flow with a `routing-strategy` header:
#   route tre-original-route/<model> (routing-strategy + model header, patched in at the
#   top of the route table) -> ext_proc tre-gateway-plugins:50052 picks a
#   tre.aibrix.io/routable=true pod (TRE_ROUTABLE_LABEL_FILTER) and sets `target-pod`
#   -> cluster httproute/tre-v2/<model>-router/rule/original-dst (ORIGINAL_DST on the
#   target-pod header).
# Without the header nothing changes: the generated per-model HTTPRoutes still send the
# request to the model Service (EDS, LEAST_REQUEST), exactly as before.
#
# One ORIGINAL_DST cluster PER MODEL, not v1's single shared one, so that
#   * each model keeps its own 4096/1024/4096/16 circuit breaker - the same numbers as
#     gateway-hardening/backendtrafficpolicy-tre-v2.yaml - instead of Envoy's default
#     1024 shared by all models (the t1 collateral-503 failure mode);
#   * the controller's SafeScale donor-health guard and the openloop pending-overflow
#     sentinel still see per-model cluster counters. The cluster is deliberately named
#     under the model HTTPRoute's cluster prefix (httproute/tre-v2/<model>-router/rule/),
#     which is exactly what controller/tre_controller/gateway_health.py sums per model,
#     so the already-deployed controller counts this traffic without a rebuild. Envoy
#     Gateway only ever emits numeric rule indices there, so the name cannot collide.
# A v1-style client that sends only routing-strategy (no model header) first matches
# tre-original-route/unattributed; the plugin stamps the body model onto the `model`
# header (TRE_ROUTE_MODEL_HEADER) after having cleared the route cache at the
# request-header phase, so the router re-picks tre-original-route/<model>. The
# unattributed cluster exists so such a request is still served if that re-pick ever does
# not happen; its upstream_rq_total should stay 0 (deploy verification checks it).
#
# Timeouts follow the current TRE arm (HTTPRoute request timeout 600s, route idle_timeout
# 3600s, cluster connect_timeout 10s). v1 used route timeout 120s (a later patch made the
# /v1 routes 150s) and ORIGINAL_DST connect_timeout 6s.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # Anchor for the EnvoyExtensionPolicy: Envoy Gateway only emits the ext_proc filter and
  # its gRPC cluster for a route the policy targets. Unlike v1's aibrix-reserved-router it
  # matches a sentinel path only, so no real request is ever served by it; real traffic
  # enables the filter through the patched original routes below.
  name: tre-reserved-router
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-gateway-plugins
    tre.aibrix.io/managed: "true"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tre-aibrix-eg
      namespace: tre-v2
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tre-extproc-reserved
      backendRefs:
        - group: ""
          kind: Service
          name: tre-gateway-plugins
          port: 50052
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: tre-gateway-plugins-extension-policy
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-gateway-plugins
    tre.aibrix.io/managed: "true"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: tre-reserved-router
  extProc:
    - backendRefs:
        - name: tre-gateway-plugins
          port: 50052
      # Every in-flight request holds one ext_proc gRPC stream for its whole life, so the
      # ext_proc cluster must never be the binding cap. Envoy's default is 1024 streams
      # SHARED by all models (v1 had to patch it up to 80000). Sized at the worst case the
      # per-model breakers can admit: 3 models x (4096 active + 1024 pending) = 15360.
      backendSettings:
        circuitBreaker:
          maxConnections: 16384
          maxPendingRequests: 16384
          maxParallelRequests: 16384
          maxParallelRetries: 16
      # Same as v1: per-message timeout 60s, fail closed. failOpen would not help here -
      # without the plugin's target-pod header the ORIGINAL_DST cluster has no host - so a
      # plugin outage is a visible 5xx rather than a silent reroute.
      messageTimeout: 60s
      failOpen: false
      processingMode:
        request:
          body: Buffered
        # Response headers only (they carry target-pod / target-pod-ip back to the client
        # for per-request attribution). v1 also streamed the response BODY
        # (response.body: Streamed), which puts every SSE chunk through a synchronous gRPC
        # round trip to the plugin - added per-token latency on exactly the TPOT the SLO
        # scores. The body was only needed for plugin-internal token accounting (TPM rate
        # limit - disabled, TRE_CHECK_RPM=0 -; request_end logs; token counts in the
        # plugin's request traces); least-gpu-cache reads the scraped vLLM metric and the
        # TRE controller reads only scraped vLLM metrics plus trace metadata, none of
        # which depend on it. To reproduce v1 exactly, add `body: Streamed` here.
        response: {}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  # Buffered request-body processing holds the whole body in the listener buffer; Envoy
  # Gateway's default per-connection limit is 32 KiB, which long prompts exceed (413).
  # Same 4 MiB as v1's aibrix-client-connection-buffersize, scoped to the tre-v2 gateway.
  name: tre-client-connection-buffersize
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-gateway-plugins
    tre.aibrix.io/managed: "true"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: tre-aibrix-eg
  connection:
    bufferLimit: 4194304
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: tre-original-dst
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-gateway-plugins
    tre.aibrix.io/managed: "true"
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: tre-aibrix-eg
  type: JSONPatch
  jsonPatches:
    # ---- clusters: one ORIGINAL_DST per model (+ unattributed safety net) --------------
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: tre-v2/original-dst/unattributed
      operation:
        op: add
        path: ""
        value:
          name: tre-v2/original-dst/unattributed
          type: ORIGINAL_DST
          lb_policy: CLUSTER_PROVIDED
          connect_timeout: 10s
          dns_lookup_family: V4_ONLY
          per_connection_buffer_limit_bytes: 32768
          original_dst_lb_config:
            use_http_header: true
            http_header_name: target-pod
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 4096
                max_pending_requests: 1024
                max_requests: 4096
                max_retries: 16
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: httproute/tre-v2/dsqwen-7b-router/rule/original-dst
      operation:
        op: add
        path: ""
        value:
          name: httproute/tre-v2/dsqwen-7b-router/rule/original-dst
          type: ORIGINAL_DST
          lb_policy: CLUSTER_PROVIDED
          connect_timeout: 10s
          dns_lookup_family: V4_ONLY
          per_connection_buffer_limit_bytes: 32768
          original_dst_lb_config:
            use_http_header: true
            http_header_name: target-pod
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 4096
                max_pending_requests: 1024
                max_requests: 4096
                max_retries: 16
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: httproute/tre-v2/dsllama-8b-router/rule/original-dst
      operation:
        op: add
        path: ""
        value:
          name: httproute/tre-v2/dsllama-8b-router/rule/original-dst
          type: ORIGINAL_DST
          lb_policy: CLUSTER_PROVIDED
          connect_timeout: 10s
          dns_lookup_family: V4_ONLY
          per_connection_buffer_limit_bytes: 32768
          original_dst_lb_config:
            use_http_header: true
            http_header_name: target-pod
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 4096
                max_pending_requests: 1024
                max_requests: 4096
                max_retries: 16
    - type: type.googleapis.com/envoy.config.cluster.v3.Cluster
      name: httproute/tre-v2/dsqwen-14b-router/rule/original-dst
      operation:
        op: add
        path: ""
        value:
          name: httproute/tre-v2/dsqwen-14b-router/rule/original-dst
          type: ORIGINAL_DST
          lb_policy: CLUSTER_PROVIDED
          connect_timeout: 10s
          dns_lookup_family: V4_ONLY
          per_connection_buffer_limit_bytes: 32768
          original_dst_lb_config:
            use_http_header: true
            http_header_name: target-pod
          circuit_breakers:
            thresholds:
              - priority: DEFAULT
                max_connections: 4096
                max_pending_requests: 1024
                max_requests: 4096
                max_retries: 16
    # ---- routes: each add at index 0 prepends, so the unattributed catch-all goes in
    # first and ends up BELOW the per-model routes (Envoy takes the first match). --------
    - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: tre-v2/tre-aibrix-eg/http
      operation:
        op: add
        path: /virtual_hosts/0/routes/0
        value:
          name: tre-original-route/unattributed
          match:
            prefix: /v1
            headers:
              - name: routing-strategy
                string_match:
                  safe_regex:
                    regex: .*
          route:
            cluster: tre-v2/original-dst/unattributed
            timeout: 600s
            idle_timeout: 3600s
          typed_per_filter_config:
            envoy.filters.http.ext_proc/envoyextensionpolicy/tre-v2/tre-gateway-plugins-extension-policy/extproc/0:
              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
              config: {}
    - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: tre-v2/tre-aibrix-eg/http
      operation:
        op: add
        path: /virtual_hosts/0/routes/0
        value:
          name: tre-original-route/dsqwen-7b
          match:
            prefix: /v1
            headers:
              - name: routing-strategy
                string_match:
                  safe_regex:
                    regex: .*
              - name: model
                string_match:
                  exact: dsqwen-7b
          route:
            cluster: httproute/tre-v2/dsqwen-7b-router/rule/original-dst
            timeout: 600s
            idle_timeout: 3600s
          typed_per_filter_config:
            envoy.filters.http.ext_proc/envoyextensionpolicy/tre-v2/tre-gateway-plugins-extension-policy/extproc/0:
              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
              config: {}
    - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: tre-v2/tre-aibrix-eg/http
      operation:
        op: add
        path: /virtual_hosts/0/routes/0
        value:
          name: tre-original-route/dsllama-8b
          match:
            prefix: /v1
            headers:
              - name: routing-strategy
                string_match:
                  safe_regex:
                    regex: .*
              - name: model
                string_match:
                  exact: dsllama-8b
          route:
            cluster: httproute/tre-v2/dsllama-8b-router/rule/original-dst
            timeout: 600s
            idle_timeout: 3600s
          typed_per_filter_config:
            envoy.filters.http.ext_proc/envoyextensionpolicy/tre-v2/tre-gateway-plugins-extension-policy/extproc/0:
              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
              config: {}
    - type: type.googleapis.com/envoy.config.route.v3.RouteConfiguration
      name: tre-v2/tre-aibrix-eg/http
      operation:
        op: add
        path: /virtual_hosts/0/routes/0
        value:
          name: tre-original-route/dsqwen-14b
          match:
            prefix: /v1
            headers:
              - name: routing-strategy
                string_match:
                  safe_regex:
                    regex: .*
              - name: model
                string_match:
                  exact: dsqwen-14b
          route:
            cluster: httproute/tre-v2/dsqwen-14b-router/rule/original-dst
            timeout: 600s
            idle_timeout: 3600s
          typed_per_filter_config:
            envoy.filters.http.ext_proc/envoyextensionpolicy/tre-v2/tre-gateway-plugins-extension-policy/extproc/0:
              "@type": type.googleapis.com/envoy.config.route.v3.FilterConfig
              config: {}
