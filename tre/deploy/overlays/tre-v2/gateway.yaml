# Isolated TRE serving gateway (ADR-0008). Dedicated Envoy proxy, own listener;
# TRE model routers parent this gateway instead of the shared aibrix-eg. Serving
# path for every inference (POST) request, restricted to routable pods
# (tre.aibrix.io/routable=true): ext_proc tre-gateway-plugins picks the pod (the
# routing-strategy header, else the plugin default least-gpu-cache) and ORIGINAL_DST
# forwards to it (gateway-extproc.yaml; the plugin applies the label gate itself).
# The generated per-model HTTPRoutes (-> model Service) only still serve non-POST
# requests (plan 2026-09-27 D10: one sleep-aware routing path).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tre-aibrix-eg
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-aibrix-eg
    tre.aibrix.io/managed: "true"
spec:
  gatewayClassName: aibrix-eg
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
