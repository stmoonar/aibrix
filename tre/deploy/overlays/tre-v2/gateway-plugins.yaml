# Isolated TRE gateway plugin (ADR-0008 + 2026-09-24 amendment). Two jobs:
#  1. metrics scraper: background pod discovery + vLLM /metrics scrape loop
#     (AIBRIX_POD_METRIC_REFRESH_INTERVAL_MS=50, as v1) writing zm keys to
#     tre-v2-redis, which the controller reads;
#  2. ext_proc router (:50052) for requests carrying `routing-strategy` on the
#     tre-v2 gateway (gateway-extproc.yaml): least-gpu-cache picks the awake pod
#     with the lowest vllm:gpu_cache_usage_perc, as v1 did.
# Exactly ONE replica, as in v1: the scrape loop is not leader-elected, so a
# second replica would double-write every tre:v2:inst/hist doc.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tre-gateway-plugins
  namespace: tre-v2
---
# Cloned tre-scoped copy of aibrix-gateway-plugins-role. Cluster-scoped but
# additive (distinct name/subject; no collision with the shared role). The pods
# verb is required for the scraper to list routable model pods in `default`;
# modeladapters is retained only to avoid a startup watch error (TRE creates none).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tre-gateway-plugins-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["model.aibrix.ai"]
    resources: ["modeladapters"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["httproutes"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tre-gateway-plugins-rolebinding
subjects:
  - kind: ServiceAccount
    name: tre-gateway-plugins
    namespace: tre-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tre-gateway-plugins-role
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tre-gateway-plugins
  namespace: tre-v2
  labels:
    app: tre-gateway-plugins
    app.kubernetes.io/name: tre-gateway-plugins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tre-gateway-plugins
  template:
    metadata:
      labels:
        app: tre-gateway-plugins
    spec:
      serviceAccountName: tre-gateway-plugins
      nodeSelector:
        kubernetes.io/hostname: nscc-ds-4a100-node10
      initContainers:
        - name: init-c
          image: busybox:stable
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'until echo "ping" | nc tre-v2-redis 6379 -w 1 | grep -c PONG; do echo waiting for service tre-v2-redis; sleep 2; done'
          env:
            - name: TRE_REDIS_SCHEMA
              value: dual
      containers:
        - name: gateway-plugins
          # Built by deploy/scripts/build_gateway_plugins_nozmq.sh (same recipe as the
          # previous 20260704-0d869b49-nozmq2; adds TRE-PATCH P2-GW-004/005).
          image: aibrix/gateway-plugins:20260924-ee7122bf-nozmq2
          imagePullPolicy: IfNotPresent
          # Same gRPC probes as the v1 aibrix-gateway-plugins (relaxed timings that
          # stopped restarts under load): the Service only gets an endpoint, and
          # ext_proc only gets a backend, once :50052 answers health checks.
          readinessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          livenessProbe:
            grpc:
              port: 50052
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          ports:
            - containerPort: 50052
              name: gateway
            - containerPort: 6060
              name: profiling
            - containerPort: 8080
              name: metrics
          env:
            - name: REDIS_HOST
              value: tre-v2-redis
            - name: REDIS_PORT
              value: "6379"
            - name: TRE_REDIS_SCHEMA
              value: dual
            - name: AIBRIX_POD_METRIC_REFRESH_INTERVAL_MS
              value: "50"
            - name: AIBRIX_PREFILL_REQUEST_TIMEOUT
              value: "60"
            - name: TRE_DEFAULT_RPM
              value: "8000"
            - name: TRE_DEFAULT_TPM_MULTIPLIER
              value: "5000"
            - name: TRE_CHECK_RPM
              value: "0"
            - name: DEBUG_POD_LIST
              value: "1"
            # Routing candidates = pods labelled tre.aibrix.io/routable=true (the
            # label service-manager maintains for BOTH arms). Mandatory here: the
            # ORIGINAL_DST route bypasses the per-model Service selector, and a
            # sleeping pod reports ~0 KV-cache usage, so least-gpu-cache would pick it.
            - name: TRE_ROUTABLE_LABEL_FILTER
              value: "true"
            # Stamp the body model onto the `model` header so v1-style clients that
            # send only routing-strategy land on their per-model ORIGINAL_DST cluster.
            - name: TRE_ROUTE_MODEL_HEADER
              value: "true"
            # Gateway-initiated wake-up stays OFF (it was "1" but inert: SERVEMENT_URL
            # was never set). v1 set both, so a request to a model with zero awake pods
            # made the gateway itself wake one; in v2 only the arm under test (TRE
            # controller or APA) may change the layout, and such a request gets a 503.
            - name: HOT_SWITCH
              value: "0"
            - name: QZ_KIND
              value: "0"
            - name: delay_time1
              value: "4000"
            - name: AIBRIX_GPU_OPTIMIZER_TRACING_FLAG
              value: "true"
            - name: TRE_TRACING_FLAG
              value: "true"
            - name: TRE_DEBUG_FLAG
              value: "false"
            - name: AIBRIX_VISUAL_TRACING_FLAG
              value: "true"
            - name: AIBRIX_PREFIX_CACHE_TOKENIZER_TYPE
              value: character
            - name: AIBRIX_PREFIX_CACHE_BLOCK_SIZE
              value: "128"
            - name: AIBRIX_PREFIX_CACHE_BLOCK_NUMBER
              value: "200000"
            - name: AIBRIX_PREFIX_CACHE_POD_RUNNING_REQUEST_IMBALANCE_ABS_COUNT
              value: "16"
            - name: AIBRIX_PREFIX_CACHE_STANDARD_DEVIATION_FACTOR
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "2"
              memory: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tre-gateway-plugins
  namespace: tre-v2
  labels:
    app: tre-gateway-plugins
    app.kubernetes.io/name: tre-gateway-plugins
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
    prometheus.io/scrape: "true"
spec:
  selector:
    app: tre-gateway-plugins
  ports:
    # ext_proc gRPC backend of tre-gateway-plugins-extension-policy (gateway-extproc.yaml).
    - name: gateway
      port: 50052
      targetPort: 50052
    - name: profiling
      port: 6060
      targetPort: 6060
    - name: metrics
      port: 8080
      targetPort: 8080
