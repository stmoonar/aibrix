apiVersion: apps/v1
kind: Deployment
metadata:
  name: tre-v2-controller
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-controller
spec:
  replicas: 1
  # Singleton controller with no leader election: a RollingUpdate would run old+new
  # pods concurrently and both could actuate. Recreate guarantees at most one controller.
  strategy:
    type: Recreate
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app.kubernetes.io/name: tre-v2-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tre-v2-controller
    spec:
      serviceAccountName: tre-v2-controller
      nodeSelector:
        kubernetes.io/hostname: nscc-ds-4a100-node10
      containers:
        - name: controller
          image: tre-v2-controller:20260710-ca61e485
          imagePullPolicy: IfNotPresent
          env:
            - name: TRE_REDIS_URL
              value: redis://tre-v2-redis:6379/0
            # zm metrics are scraped into tre-v2-redis by the isolated
            # tre-gateway-plugins (ADR-0008); keep v1 read schema.
            - name: TRE_METRICS_REDIS_URL
              value: redis://tre-v2-redis:6379/0
            - name: TRE_METRICS_SCHEMA
              value: v2
            - name: TRE_SERVICE_MANAGER_URL
              value: http://tre-v2-service-manager:8000
            # Per-model params load from the tre-v2-registry ConfigMap mounted below, so
            # the console can edit theta_m/tau_*/SLOs and restart-to-apply without an image
            # rebuild. The baked /app/tre/deploy/registry.yaml stays as an escape-hatch
            # fallback (flip this value back to it via `kubectl set env`).
            - name: TRE_REGISTRY_PATH
              value: /etc/tre/registry.yaml
            # --- Signal / percentile口径 (F2 + D2) ---
            - name: TRE_SIGNAL_SOURCE
              value: zm
            - name: TRE_PERCENTILE_MODE
              value: bucket_upper
            # --- F2 zm read-side fixes (baseline lookback / degrade / EMA hold) ---
            - name: TRE_HIST_BASELINE_LOOKBACK_MS
              value: "90000"
            # N1: short windows + low QPS can leave single-digit latency samples; below
            # this count a window's p95 is nulled (unavailable) rather than decided on.
            - name: TRE_MIN_LATENCY_SAMPLES
              value: "10"
            - name: TRE_INCOMPLETE_POLICY
              value: drop_model
            - name: TRE_PAPER_STALE_MAX_WINDOWS
              value: "3"
            # --- Loop cadence / windows (D2; S1.1/S1.2 signal-freshness) ---
            - name: TRE_MONITOR_INTERVAL_SECONDS
              value: "20"
            # D8 (09-22): phase-aligned sampler. Sleeps to the next 10 s gateway write
            # boundary + offset and reads (boundary-30s, boundary]: exactly 3 instant
            # ticks and a full 30 s token span per window, one new snapshot per 10 s.
            # The offset is a floor: the sampler re-reads until the boundary tick exists
            # and adapts (the tre-gateway ticker is not boundary-aligned; its writes land
            # ~5.3 s after the boundary as of 09-22). free_running = the old refresh loop
            # (TRE_METRICS_REFRESH_INTERVAL_SECONDS + TRE_METRICS_WINDOW_MODE).
            - name: TRE_METRICS_REFRESH_MODE
              value: phase_aligned
            - name: TRE_METRICS_PHASE_OFFSET_MS
              value: "2000"
            # Only used by TRE_METRICS_REFRESH_MODE=free_running.
            - name: TRE_METRICS_REFRESH_INTERVAL_SECONDS
              value: "5"
            # The rescue loop still wakes every 5 s, but snapshots change every 10 s and a
            # re-read of one window advances neither the EMA nor the dwell: the effective
            # decision cadence is 10 s (acted on <= 5 s after the snapshot is published).
            - name: TRE_RESCUE_INTERVAL_SECONDS
              value: "5"
            - name: TRE_FAIRNESS_INTERVAL_SECONDS
              value: "10"
            # D8 band dwell OFF (v1/paper alignment A5: neither the paper nor v1 has a
            # dwell). "2" would make CRITICAL / LOW / HIGH act only after 2 consecutive new
            # windows (20 s at the 10 s cadence), counted by window_end_ms.
            - name: TRE_DWELL_WINDOWS
              value: "1"
            # S1.1: sliding window (no 60-120s tumbling staleness). free_running only;
            # phase_aligned always reads the half-open window ending on the boundary.
            - name: TRE_METRICS_WINDOW_MODE
              value: "sliding"
            # S1.2: single shared window shortened 60s->30s (3x the 10s write period,
            # covers 3 histogram points). FROZEN 2026-07-08 (ADR-0012): S1.2 real-machine acceptance on the
            # isolated tre-v2 plane, n=12 step-load trials over 3 models; first-reflection lag
            # (onset->first non-null z_m) P50=11.0s P95=12.7s max=14.9s <= 35s target -> W
            # authoritative at 30000. Evidence: docs/refactor/p11_evidence/s1_shortwindow_20260708/.
            # This is the single window S1.4 / R3 theta_m refit must use.
            - name: TRE_METRICS_WINDOW_MS
              value: "30000"
            # G5/N1.3: SafeScale commit-gate SLOs pinned explicitly to match the
            # registry.yaml calibration SLOs (ttft 500 / tpot 75), overriding the
            # looser 1200/100 code defaults so the shrink safety gate cannot silently
            # drift wider than calibration.
            - name: SAFE_SCALE_TTFT_P95_SLO_MS
              value: "500"
            - name: SAFE_SCALE_TPOT_P95_SLO_MS
              value: "75"
            # A6 (v1/paper alignment): adaptive probe window
            # W = clamp(MIN, MAX, max(2*p95_e2e, CDEC*p95_tpot, Q/rate_gap)); the queue
            # term falls back to CW2_FALLBACK when the post-hide rate gap is ~0. Startup
            # guard: MIN*(1-HQ) >= TRE_METRICS_WINDOW_MS + 10 s refresh + phase offset.
            - name: SAFE_SCALE_MIN_WINDOW_MS
              value: "60000"
            - name: SAFE_SCALE_MAX_WINDOW_MS
              value: "120000"
            - name: SAFE_SCALE_CW2_FALLBACK_MS
              value: "60000"
            # --- Ablation switches (D4); production defaults ---
            - name: ENABLE_TRE_SCALING
              value: "true"
            - name: TRE_ABLATION_DISABLE_FAST_LOOP
              value: "false"
            - name: TRE_ABLATION_DISABLE_SAFESCALE
              value: "false"
            # A2 (v1/paper alignment): the receiver-less HIGH proactive SafeScale shrink
            # (v1 paper_high_proactive_shrink) is live; "1" re-enables the t1 guard.
            - name: TRE_SAFESCALE_SUPPRESS_HOT_PROACTIVE
              value: "0"
            # Opt-in control-loop profiling capability (measures TRE's own per-tick
            # latency + CPU for the paper). OFF by default; an operator flips this to
            # "true" and restarts the pod for a profiling run. See tre_controller.profiling.
            - name: TRE_PROFILE
              value: "false"
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: registry
              mountPath: /etc/tre
              readOnly: true
      volumes:
        # Non-optional: a missing/deleted ConfigMap blocks the new pod at ContainerCreating
        # rather than silently booting stale or absent config.
        - name: registry
          configMap:
            name: tre-v2-registry
