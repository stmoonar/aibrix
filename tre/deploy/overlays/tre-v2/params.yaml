apiVersion: v1
data:
  registry.yaml: |
    cluster:
      # At most this many bindings (sleeping or awake) may share one physical GPU.
      max_bound_per_gpu: 3
      nodes:
      - name: nscc-ds-4a100-node9
        gpus: 4
        gpu_uuids:
        - GPU-689a3e93-68db-0dac-160b-6a791cf246e8
        - GPU-d0de9f25-c059-d2ee-e7c4-c242bbdc76c7
        - GPU-3a113474-dd92-6d52-d05b-491e7b020ded
        - GPU-3c2fb581-708a-5fef-3eaa-5c3cc21a028e
        two_gpu_slots:
        - - 0
          - 1
        - - 2
          - 3
      - name: nscc-ds-4a100-node10
        gpus: 4
        gpu_uuids:
        - GPU-71f560a8-e090-c7e6-325f-2e386c08136f
        - GPU-4bcbcb0c-7eaf-64a1-b3e5-b07cb81d3a96
        - GPU-28af749d-4081-d7b6-0c14-cf9c29aa213d
        - GPU-76a392a5-b027-42be-fb8f-1bfe9079b47c
        two_gpu_slots:
        - - 0
          - 1
        - - 2
          - 3
    # GPU placement policy shared by the controller planner and the service-manager
    # (tre_common.gpu_placement; design tre/docs/design/20260928-placement-node-balance.md).
    # The policy's block order cap is derived from the models: log2(max tp_size). Every
    # key is optional; the values below are the built-in defaults.
    placement:
      # Keep this many fully free aligned blocks of the widest model's size (TP2 pairs
      # with the current models) when waking / creating narrower replicas. Soft: it
      # ranks placements and never blocks one; bounded by the widest models' remaining
      # awake headroom; a no-op when every model is tp_size 1.
      reserve_tp_pairs: 1
      defrag:
        # Automatic defragmentation (controller critical_tp_defrag migrations). Off by
        # default, as in v1. While off, the service-manager POST /v2/defrag also refuses
        # (409) unless the request body carries force: true.
        enabled: false
    models:
    - name: dsqwen-7b
      weights_path: /data/nfs_shared_data/DeepSeek-R1-Distill-Qwen-7B
      tp_size: 1
      min_replicas: 1
      # max_replicas = GPU layout (bindings rendered by make manifests);
      # max_awake_replicas = scaling cap (TRE planner + SM + APA maxReplicas).
      max_replicas: 8
      max_awake_replicas: 4
      # vLLM 0.30 fork image (plan 2026-09-27 D9): upstream ced6857af + pinned_weights
      # sleep backend + sleep rollback fix + --sleep-reject-new / --abort-return-token-ids.
      # A new image invalidates the calibrated theta (D9: recalibrate after migrating).
      vllm_image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
      # Fork features of that image; their engine flags are rendered while reissue.enabled.
      vllm_features:
      - sleep_reject_new
      - abort_return_token_ids
      # null = vLLM default (cumem). Option: pinned_weights (fork backend: pinned host copy
      # kept for the process lifetime, sleep ~0.07 s but wake ~0.4 s slower, level 1 only).
      sleep_mode_backend: null
      slo:
        ttft_p95_ms: 500.0
        tpot_p95_ms: 75.0
        e2e_p95_ms: 12000.0
        # Idle TTFT(L) = c + b * prompt_tokens: the calibration label's slowdown TTFT SLO
        # is max(floor, k * idle); primary label k = 5, floor 500 ms (plan 2026-09-21 6.11 D6'). LIVE: safescale.slo_mode labels uses the same TTFT threshold; provenance
        # 2026-10-03 idle capture on vllm-openai-tre:0.30.0-ts-8dc0f2a7 (scripts.ttft_idle_capture, chat api,
        # one request in flight, L 128-4096 x 30), fit scripts.ttft_idle_fit --min-gap-ms 500 over the full
        # L range (n 210 per model; an L <= 2048 fit differs < 7 % on L 256-2200). Old engine: 09-22 fit.
        ttft_idle_c_ms: 41.1
        ttft_idle_b_ms_per_token: 0.0694
        ttft_slo_mode: slowdown
        ttft_slowdown_k: 5.0
        ttft_floor_ms: 500.0
      alt_thresholds:
        queue_len:
          theta: 78.33333333333333
          direction: lower_is_healthier
        decode_tps:
          theta: 2218.6666666666665
          direction: lower_is_healthier
        prefill_tps:
          theta: 6081.666666666667
          direction: lower_is_healthier
      # theta_m/w_p/lambda_wait/tau_crit/tau_high/ema_alpha: next-round calibration on the 0.30 engine, accepted
      # 2026-10-05 (onset gate, T14 pass); freeze calib_20261003/next-20261005/freeze/params_freeze.v2.json
      # sha256 708d1e64... (published theta, lambda_wait, w_p, tau_crit, tau_high; delta_crit/high = tau_low 1.0 -
      # tau_crit / tau_high - tau_low; tau_s 10 s = ema_tau_ms; ema_alpha is the freeze registry field, inert while
      # ema_tau_ms is set). Goes live atomically with slo.ttft_idle_c_ms/b_ms_per_token.
      trs:
        w_p: 0.02
        w_d: 1.0
        lambda_wait: 2.375
        qmin: 1.0
        ema_alpha: 0.632121
        theta_m: 771.0746050443564
        tau_crit: 0.63
        tau_low: 1.0
        tau_high: 1.86
        qsat: 4.0
        epsat: 0.05
        hsat: 3
        ema_tau_ms: 10000
      vllm_extra_args:
      - --no-enable-prefix-caching
      - --max-num-seqs
      - '256'
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - '2048'
      - --gpu-memory-utilization
      - '0.85'
      # --max-model-len; null = the model's maximum.
      max_model_len: null
    - name: dsllama-8b
      weights_path: /data/nfs_shared_data/DeepSeek-R1-Distill-Llama-8B
      tp_size: 1
      min_replicas: 1
      # max_replicas = GPU layout (bindings rendered by make manifests);
      # max_awake_replicas = scaling cap (TRE planner + SM + APA maxReplicas).
      max_replicas: 8
      max_awake_replicas: 4
      # vLLM 0.30 fork image (plan 2026-09-27 D9): upstream ced6857af + pinned_weights
      # sleep backend + sleep rollback fix + --sleep-reject-new / --abort-return-token-ids.
      # A new image invalidates the calibrated theta (D9: recalibrate after migrating).
      vllm_image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
      # Fork features of that image; their engine flags are rendered while reissue.enabled.
      vllm_features:
      - sleep_reject_new
      - abort_return_token_ids
      # null = vLLM default (cumem). Option: pinned_weights (fork backend: pinned host copy
      # kept for the process lifetime, sleep ~0.07 s but wake ~0.4 s slower, level 1 only).
      sleep_mode_backend: null
      slo:
        ttft_p95_ms: 500.0
        tpot_p95_ms: 75.0
        e2e_p95_ms: 12000.0
        # Idle TTFT(L) = c + b * prompt_tokens: the calibration label's slowdown TTFT SLO
        # is max(floor, k * idle); primary label k = 5, floor 500 ms (plan 2026-09-21 6.11 D6'). LIVE: safescale.slo_mode labels uses the same TTFT threshold; provenance
        # 2026-10-03 idle capture on vllm-openai-tre:0.30.0-ts-8dc0f2a7 (scripts.ttft_idle_capture, chat api,
        # one request in flight, L 128-4096 x 30), fit scripts.ttft_idle_fit --min-gap-ms 500 over the full
        # L range (n 210 per model; an L <= 2048 fit differs < 7 % on L 256-2200). Old engine: 09-22 fit.
        ttft_idle_c_ms: 48.1
        ttft_idle_b_ms_per_token: 0.0717
        ttft_slo_mode: slowdown
        ttft_slowdown_k: 5.0
        ttft_floor_ms: 500.0
      alt_thresholds:
        queue_len:
          theta: 46.333333333333336
          direction: lower_is_healthier
        decode_tps:
          theta: 1634.1333333333334
          direction: lower_is_healthier
        prefill_tps:
          theta: 2186.6666666666665
          direction: lower_is_healthier
      # theta_m/w_p/lambda_wait/tau_crit/tau_high/ema_alpha: next-round calibration on the 0.30 engine, accepted
      # 2026-10-05 (onset gate, T14 pass); freeze calib_20261003/next-20261005/freeze/params_freeze.v2.json
      # sha256 708d1e64... (published theta, lambda_wait, w_p, tau_crit, tau_high; delta_crit/high = tau_low 1.0 -
      # tau_crit / tau_high - tau_low; tau_s 10 s = ema_tau_ms; ema_alpha is the freeze registry field, inert while
      # ema_tau_ms is set). Goes live atomically with slo.ttft_idle_c_ms/b_ms_per_token.
      trs:
        w_p: 0.01
        w_d: 1.0
        lambda_wait: 2.5
        qmin: 1.0
        ema_alpha: 0.632121
        theta_m: 674.210074236801
        tau_crit: 0.54
        tau_low: 1.0
        tau_high: 1.9
        qsat: 4.0
        epsat: 0.05
        hsat: 3
        ema_tau_ms: 10000
      vllm_extra_args:
      - --no-enable-prefix-caching
      - --max-num-seqs
      - '256'
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - '2048'
      - --gpu-memory-utilization
      - '0.85'
      # --max-model-len; null = the model's maximum (131072), as in v1. Measured 2026-09-29 (current
      # 0.30 image): KV is 16.76 GiB / 137,248 tok regardless of sleeping neighbours (vLLM budgets
      # util x total memory). Real risks: margin only ~0.76 GiB (one full-length request at a time),
      # and an AWAKE same-GPU neighbour fails the startup free-memory check. If 8b will not start,
      # read the log: free memory short -> sleep neighbour / reorder; KV < max_model_len -> pin this
      # (commit + make manifests first, then merge live; changes the theta calibration basis).
      max_model_len: null
    - name: dsqwen-14b
      weights_path: /data/nfs_shared_data/Models/DeepSeek-R1-Distill-Qwen-14B
      tp_size: 2
      # 1 as in v1 (every v1 model had >=1 replica): with the gateway HOT_SWITCH=0 a model
      # never sits at zero awake pods, so no request path depends on a wake-from-zero.
      min_replicas: 1
      # max_replicas = GPU layout (bindings rendered by make manifests);
      # max_awake_replicas = scaling cap (TRE planner + SM + APA maxReplicas).
      max_replicas: 4
      max_awake_replicas: 4
      # vLLM 0.30 fork image (plan 2026-09-27 D9): upstream ced6857af + pinned_weights
      # sleep backend + sleep rollback fix + --sleep-reject-new / --abort-return-token-ids.
      # A new image invalidates the calibrated theta (D9: recalibrate after migrating).
      vllm_image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
      # Fork features of that image; their engine flags are rendered while reissue.enabled.
      vllm_features:
      - sleep_reject_new
      - abort_return_token_ids
      # null = vLLM default (cumem). Option: pinned_weights (fork backend: pinned host copy
      # kept for the process lifetime, sleep ~0.07 s but wake ~0.4 s slower, level 1 only).
      sleep_mode_backend: null
      slo:
        ttft_p95_ms: 500.0
        tpot_p95_ms: 75.0
        e2e_p95_ms: 15000.0
        # Idle TTFT(L) = c + b * prompt_tokens: the calibration label's slowdown TTFT SLO
        # is max(floor, k * idle); primary label k = 5, floor 500 ms (plan 2026-09-21 6.11 D6'). LIVE: safescale.slo_mode labels uses the same TTFT threshold; provenance
        # 2026-10-03 idle capture on vllm-openai-tre:0.30.0-ts-8dc0f2a7 (scripts.ttft_idle_capture, chat api,
        # one request in flight, L 128-4096 x 30), fit scripts.ttft_idle_fit --min-gap-ms 500 over the full
        # L range (n 210 per model; an L <= 2048 fit differs < 7 % on L 256-2200). Old engine: 09-22 fit.
        ttft_idle_c_ms: 45.3
        ttft_idle_b_ms_per_token: 0.0879
        ttft_slo_mode: slowdown
        ttft_slowdown_k: 5.0
        ttft_floor_ms: 500.0
      alt_thresholds:
        queue_len:
          theta: 191.66666666666666
          direction: lower_is_healthier
        decode_tps:
          theta: 6536.533333333334
          direction: lower_is_healthier
        prefill_tps:
          theta: 10670.4
          direction: lower_is_healthier
      # theta_m/w_p/lambda_wait/tau_crit/tau_high/ema_alpha: next-round calibration on the 0.30 engine, accepted
      # 2026-10-05 (onset gate, T14 pass); freeze calib_20261003/next-20261005/freeze/params_freeze.v2.json
      # sha256 708d1e64... (published theta, lambda_wait, w_p, tau_crit, tau_high; delta_crit/high = tau_low 1.0 -
      # tau_crit / tau_high - tau_low; tau_s 10 s = ema_tau_ms; ema_alpha is the freeze registry field, inert while
      # ema_tau_ms is set). Goes live atomically with slo.ttft_idle_c_ms/b_ms_per_token.
      trs:
        w_p: 0.0025
        w_d: 1.0
        lambda_wait: 2.25
        qmin: 1.0
        ema_alpha: 0.632121
        theta_m: 642.6049429483861
        tau_crit: 0.64
        tau_low: 1.0
        tau_high: 2.02
        qsat: 4.0
        epsat: 0.05
        hsat: 3
        ema_tau_ms: 10000
      vllm_extra_args:
      - --no-enable-prefix-caching
      - --max-num-seqs
      - '256'
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - '2048'
      - --gpu-memory-utilization
      - '0.85'
      # --max-model-len; null = the model's maximum (131072), as in v1.
      max_model_len: null
    # vLLM container settings shared by every model pod (make manifests and the
    # service-manager's runtime creates). env merges over the built-in
    # VLLM_SERVER_DEV_MODE=1 (vLLM >= 0.2x mounts /sleep, /wake_up, /is_sleeping only in dev
    # mode); a model's vllm_env merges over it. NVIDIA_VISIBLE_DEVICES / CUDA_VISIBLE_DEVICES
    # are set per binding and may not appear here.
    vllm:
      env:
        VLLM_SERVER_DEV_MODE: '1'
        VLLM_WORKER_MULTIPROC_METHOD: spawn
        # Weights are local paths; never reach out to a model hub.
        HF_HUB_OFFLINE: '1'
        # uvicorn keep-alive of the vLLM HTTP server (vLLM default 5 s). The reissue sidecar
        # pools its loopback connections to vLLM for reissue.upstream_keepalive_s (default 2 s,
        # validated to be >= 1 s below this); 75 s keeps vLLM from closing a connection the sidecar is
        # about to reuse (502s in the 2026-09-30 smoke). Takes effect when the pods are recreated.
        VLLM_HTTP_TIMEOUT_KEEP_ALIVE: '75'
        # PYTORCH_ALLOC_CONF=pinned_max_round_threshold_mb:1 (exact-size pinned host blocks,
        # ~1.0x instead of ~1.9x the weights in host RAM) must NOT be set with the cumem
        # backend: with it every sleep after the first wake fails in CuMemAllocator.sleep
        # (cudaMemcpy -> CUDART error: invalid argument; reproduced 2026-09-28 on
        # vllm-openai-tre:0.30.0-ts-2be2d647, 3/3 cycles fail; without it 3/3 pass).
        # Host RAM without it: ~1.9x weights per pod once slept (7b ~30 GiB), ~360 GiB per node.
    # Gateway behaviour shared by the manifests and the service-manager.
    gateway:
      # Request timeout of every model route: the single source for the model
      # HTTPRoute timeout (make manifests) and the service-manager drain hard cap
      # (service_manager.sleep.hard_cap_s may not exceed it). Keep the tre-v2 ext_proc
      # route timeout (overlays/tre-v2/gateway-extproc.yaml) equal; a guard test
      # enforces it.
      route_timeout_s: 150
      # Stable ClusterIP Service in front of the tre-v2 Envoy proxy pods, for
      # in-cluster clients (the reissue sidecar). Rendered by the tre-v2 overlay
      # (gateway-service.yaml; keep its kustomize param tre-gateway-service-params
      # equal, a guard test enforces it). The namespace is where the Envoy proxy
      # pods run (a Service selects only pods of its own namespace).
      service_name: tre-gateway
      service_namespace: envoy-gateway-system
      service_port: 80
      # Idle timeout of Envoy's upstream connections to the model pods (Envoy's own default
      # is 1 h). Must be >= 1 s BELOW the keep-alive of the server on the pod's port 8000
      # (reissue.server_keepalive_s with the sidecar, else vLLM's VLLM_HTTP_TIMEOUT_KEEP_ALIVE;
      # the registry validates it): the sender closes idle connections first, else Envoy
      # reuses a connection the pod is closing (503 UC). Keep the hand-written values equal
      # (a guard test enforces it): the ORIGINAL_DST clusters in
      # overlays/tre-v2/gateway-extproc.yaml and gateway-hardening/backendtrafficpolicy-tre-v2.yaml.
      upstream_idle_timeout_s: 60
    # Retry / continuation sidecar in every model pod (plan 2026-09-27 D5/D6; design
    # tre/docs/design/20260927-reissue-sidecar-v2.md). Every key is optional; the values
    # below are the built-in defaults. The sidecar takes the serving port 8000 and vLLM
    # moves to 127.0.0.1:vllm_port; enabled: false renders the model pods exactly as
    # without it. Aborted requests are continued only on images that declare the vLLM
    # fork features (models[].vllm_features: [sleep_reject_new, abort_return_token_ids],
    # which also add the engine flags); without them the sidecar still retries requests
    # that reach a sleeping pod. Read by make manifests and by the service-manager
    # (runtime creates), so keep the tre-v2-registry ConfigMap copy equal.
    reissue:
      enabled: true
      # null = the gateway: section's stable Service (http://<service_name>.
      # <service_namespace>.svc.cluster.local:<service_port>); never an IP / NodePort.
      gateway_url: null
      vllm_port: 8001
      max_depth: 3
      retry_attempts: 4
      # Optional keys of the 2026-09-30 keep-alive fixes (defaults shown, deliberately left as
      # comments): controller, service-manager and UI of 20260930-f8ccb0ca and older REJECT
      # unknown reissue keys (parse_reissue_config raises; a controller would crashloop and
      # the UI's PUT /api/params would fail). Write them into the LIVE registry only after
      # controller, SM and UI are ALL upgraded to an image that knows them. A guard test
      # (deploy/tests/test_reissue_manifests.py) keeps this section within the old key set.
      #   upstream_keepalive_s: 2        # loopback sidecar -> vLLM pool idle; <= every model's
      #                                  # VLLM_HTTP_TIMEOUT_KEEP_ALIVE - 1 (registry-validated)
      #   local_reconnect_attempts: 1    # fresh-connection re-sends before the first byte (0 = off)
      #   local_reconnect_window_s: 1    # ... only within this many s of the connection being
      #                                  # handed out (the keep-alive race fails at once)
      #   server_keepalive_s: 75         # sidecar's own HTTP server (Envoy -> sidecar); must be
      #                                  # >= 1 s above gateway.upstream_idle_timeout_s
      # null = the model's vllm_image (python3 + aiohttp; the script comes from a ConfigMap).
      image: null
      cpu_request: 50m
      # Limits for the in-flight bound (Envoy max_requests 4096 per pod; 2026-10-05).
      cpu_limit: '2'
      memory_request: 64Mi
      memory_limit: 1Gi
    # Service-manager behaviour (plan 2026-09-27). Every key is optional; the values
    # below are the built-in defaults. Changes to the LIVE registry (ConfigMap
    # tre-v2-registry) go through the console (PUT /api/params), never a kubectl apply
    # of overlays/tre-v2/params.yaml; the service-manager reads this section at start,
    # so restart it afterwards (kubectl -n tre-v2 rollout restart
    # deploy/tre-v2-service-manager).
    service_manager:
      # Whole-lock (2026-10-02, design docs/design/20261002-sm-wholelock.md): every
      # write holds the SM writer lock from start to end - a sleep from its hide to
      # its bookkeeping, a wake from its checks to its commit, a transfer for both.
      # A request waits up to writer_lock_wait_s for the lock (first-come
      # first-served), then gets 409 writer_busy. 30 s queue behind several ordinary
      # 2-5 s operations; behind a worst-case hold (a hung engine) a caller gets 409
      # writer_busy and retries on its next tick.
      writer_lock_wait_s: 30
      # Deprecated and ignored (2026-10-02: a sleep has no separate commit phase).
      commit_lock_wait_s: null
      # Timeout clients (the controller) use for slow SM calls. Must exceed the
      # worst-case call = writer_lock_wait_s + the longest writer-lock hold (a
      # transfer, any number of pairs: its donors' sleep - ack_timeout_s +
      # probe_timeout_s + sleep_call_timeout_s + max(physical_confirm_timeout_s +
      # probe_timeout_s, 4 x probe_timeout_s) + io_margin_s = 42 s - plus its
      # receivers' wake - probe_timeout_s + wake.call_timeout_s + 2 x probe_timeout_s
      # + ONE compensating sleep (42 s) + io_margin_s = 69 s - plus one selection
      # probe round) + io_margin_s = 30 + 116 + 2 = 148 s with these values; validated
      # at SM and controller
      # start. The controller uses it unless TRE_SM_SLOW_TIMEOUT_SECONDS overrides it.
      api_call_timeout_s: 360
      # Level of the service-manager's own loggers (tre_sm, tre_common): CRITICAL,
      # ERROR, WARNING, INFO or DEBUG; the TRE_SM_LOG_LEVEL env var overrides it.
      log_level: INFO
      # Replica floor (2026-09-29): no hide or sleep may leave a model with fewer
      # ROUTABLE replicas (awake, not hidden, Ready, not starting) than its
      # models[].min_replicas - both arms (TRE and APA) use it. A model-level shrink
      # (/target on any path, /scale_service, a transfer's donor model): clamped (200,
      # taken + clamped_by_floor). A named binding (/power), the SafeScale hide and
      # defrag: refused (409 floor_violation; the controller re-plans next tick).
      # Routable view unreadable: 409 routable_unknown before anything is hidden.
      # Startup admission: another replica is woken first (best effort, in its own
      # writer phase, within max_awake_replicas; after the start converges the
      # suspended resident stays asleep - a swap); if none can be woken the start
      # is exempt (recorded, never retried on the floor). Fleet repair: exempt,
      # recorded. Counters (persistent, Redis): GET /v2/sleep -> floor. false = off.
      # A defrag move is make-before-break: max_awake_replicas may be exceeded by
      # one for the duration of one move. The startup make-up never exceeds it (at
      # the cap there is no make-up: the start is exempt).
      replica_floor:
        enforce: true
        # WARNING log of a floor event at most once per (outcome, path, model) per
        # this many seconds (counters always count; 0 = every event).
        log_interval_s: 60
      # A Pod whose startup gate is polling (asked within gate_seen_s) is reported
      # as startup_admission_pending (informational, no fleet repair) instead of
      # drift, for at most drift_grace_s since its first request; longer = drift.
      startup_admission:
        gate_seen_s: 30
        drift_grace_s: 600
      sleep:
        # Every sleep runs hide (routable=false + route-gen bump) -> gateway plugin ack
        # -> one load read -> ONE /sleep -> physical confirmation (D1/D2), all under
        # the writer lock (whole-lock, 2026-10-02); no caller can skip a step and
        # nothing drains (draining is the controller's job). The four timeouts below
        # bound one sleep's lock hold: 5 + 5 + 10 + max(8 + 5, 4 x 5) + 2 = 42 s.
        # Max wait for every live gateway plugin instance to report the new route-gen
        # (measured 7-15 ms; a timeout rolls the hide back).
        ack_timeout_s: 5
        # A plugin instance is live while its heartbeat score (tre:v2:gw:instances)
        # keeps advancing: the SM saw it change within this many seconds of its own
        # monotonic clock (never compared with a wall clock).
        instance_staleness_s: 10
        # The hide converges only with at least this many live plugin instances: an
        # empty live set never counts as "all acked".
        gateway_min_instances: 1
        # Opt-in: with no live plugin instance at all, wait for the k8s label plus
        # no_plugin_grace_s instead of an ack (no in-flight view from the gateway).
        # false: no live instance = ack timeout = rollback.
        fallback_no_plugin: false
        no_plugin_grace_s: 5
        poll_interval_s: 0.5
        # HTTP timeout of the ONE /sleep call (weight offload, measured 1-3 s). No
        # answer in time: the pod stays hidden, its journal entry is marked
        # sleep_unconfirmed, the lock is released at once and the journal recovery
        # settles it from the physical state (no second call).
        sleep_call_timeout_s: 10
        # HTTP timeout of every other vLLM probe (/metrics, /version, /is_sleeping,
        # /is_paused, /resume, the wake gate's resident probes). No answer reads as
        # "unknown", which every caller treats fail-closed. Targets are probed in
        # parallel. 5 s (the live value): many probes hit an AWAKE engine under load.
        probe_timeout_s: 5
        # Allowance for Redis / Kubernetes calls in the worst-case lock hold.
        io_margin_s: 2
        # After /sleep, wait this long for /is_sleeping to report true. Not confirmed
        # then: the pod stays hidden (sleep_unconfirmed), the audit reports it and
        # the journal recovery settles it.
        physical_confirm_timeout_s: 8
        # auto: probe GET /version per pod and send mode=abort|wait only to vLLM
        # versions that accept it (>= 0.18); true/false force it. Without it a sleep
        # with requests in flight is rolled back (false: a plain /sleep is sent).
        vllm_sleep_mode_param: auto
        # Mode of the /sleep when the load read shows nothing in flight: abort (a
        # sleep interrupts) or wait (opt-in). With requests in flight: always abort;
        # the reissue sidecar continues what it can.
        sleep_mode_when_idle: abort
        # Deprecated and ignored (2026-10-02: no drain, no sleep reservation); still
        # parsed so older registries keep loading.
        hard_cap_s: null
        reservation_ttl_s: 30
        # Plugin instances that must ack = advancing heartbeats UNION Ready pods
        # matching this selector: a plugin with Redis trouble may still route while
        # its heartbeat stalls. label_selector: null = heartbeats only. Contract keys
        # are keyed by pod NAME only: TRE model pods need unique names across
        # namespaces (the generated Deployments guarantee it).
        gateway_plugin_pods:
          namespace: tre-v2
          label_selector: app=tre-gateway-plugins
        # Deprecated and ignored (2026-10-02: the service-manager never drains on any
        # path): the former soft drain budgets per sleep path and the no-drain paths.
        # Still parsed (the controller reads budgets_s.safescale_commit for its own
        # probe window); apa is not spelled out: images before 2026-09-29 reject an
        # unknown budgets_s path at start. no_drain_paths lists every path (as live
        # since 2026-10-06), so an older SM image (a rollback) never drains either.
        budgets_s:
          safescale_commit: null
          urgent: 30
          scale_down: null
          defrag: 30
          repair: 30
          startup: 30
          default: 30
        no_drain_paths: [safescale_commit, urgent, scale_down, apa, defrag, repair, startup, default]
      wake:
        # HTTP timeout of ONE /wake_up call (single attempt, measured 1.5-3 s). No
        # answer in time: the wake stays journaled (with its GPU lease) and the
        # journal recovery rechecks it; the lock is released.
        call_timeout_s: 10
        # A wake fails closed unless gpu-truth shows every target GPU at or below this
        # fraction of its total memory: sleeping residents stay far below it, an awake
        # resident or a sleep leak far above.
        max_used_fraction: 0.2
        # Optional absolute override in MiB; null = use max_used_fraction.
        max_used_mib: null
        # A wake / cold start asks the gpu-truth agent for a fresh sample
        # (tre:gpu_truth_refresh:<node>) and waits up to this long for one taken after
        # the request (an old agent without refresh support: re-read the periodic
        # sample for up to this long). Missing truth still fails closed.
        truth_wait_s: 10
      create:
        # A cold start (scale-up create, sparse defrag destination) fails closed unless
        # gpu-truth shows every target GPU at or below total x (1 - the created
        # model's --gpu-memory-utilization) - margin_mib: vLLM refuses to start with
        # less than gpu_memory_utilization x total free. Sleeping neighbours fit, an
        # awake one does not.
        margin_mib: 512
        # Optional absolute override in MiB; null = the derived limit. The env var
        # TRE_CREATE_MAX_USED_MIB (unset by default) overrides both.
        max_used_mib: null
      clock_skew:
        # Startup check of the local clock against Redis TIME.
        warn_s: 1.0
        # Refuse to start above this skew; null = warn only.
        fail_s: null
      node_pressure:
        # Only registry nodes (cluster.nodes) can block a cold start.
        registry_nodes_only: true
    # SafeScale probe (controller only; read at start, restart-to-apply; every key
    # optional, the values below are the built-in defaults). Controller images before
    # 2026-09-29 (safescale-evidence) ignore this section.
    safescale:
      # Latency thresholds of the probe (immediate rollback and commit gate):
      # labels - the calibration label's rule (tre_common.slo_labels): TPOT 75 ms,
      #          TTFT = max(slo.ttft_floor_ms, k * (c + b * L)) with L the mean prompt
      #          length of the judged window (L unknown -> the floor);
      # fixed  - models[].slo.ttft_p95_ms / tpot_p95_ms (v1: 500 / 75 ms).
      # The controller env SAFE_SCALE_TTFT_P95_SLO_MS / SAFE_SCALE_TPOT_P95_SLO_MS (unset
      # by default) override the respective threshold in either mode.
      slo_mode: labels
      # Probe window W = min(max(SAFE_SCALE_E2E_MULTIPLIER x p95_e2e,
      # SAFE_SCALE_WINDOW_FLOOR_MS), window_ceiling_s); deadline extensions (one gateway
      # period each, while the post-hide evidence holds fewer than min_commit_samples
      # completed requests) never pass it either.
      window_ceiling_s: 60
      # Completed requests (TTFT count of the remaining pods since the first gateway
      # boundary after the hide) needed to judge latency at the deadline. Still short at
      # the ceiling: no traffic -> commit (v1 idle rule); traffic -> latency skipped,
      # Z / KV-cache judged.
      min_commit_samples: 20
      # The evidence starts at the first gateway boundary after the hide (newest doc
      # stamp at the SM's confirmation + one period, gateway clock only). Each remaining
      # pod's first evidence doc must be stamped within [start, newest + this]; otherwise
      # the probe rolls back (evidence_clock_skew: missed gateway ticks). Offsets of Redis
      # TIME / the controller clock beyond this are logged (safescale_clock_skew_alert).
      evidence_clock_tolerance_s: 20
      # Where the probe's latency / KV-cache evidence comes from:
      # direct - the controller scrapes the remaining pods' vLLM /metrics itself
      #          (pod IP from the SM fleet state, port metrics_port): baseline at the
      #          SM's hide confirmation, then every evidence_poll_s; an SLO violation
      #          rolls back as soon as min_commit_samples requests are judged; the
      #          deadline is confirmation + W (extended by evidence_poll_s while short).
      #          A probe whose remaining pods all fail falls back to redis.
      # redis  - the gateway's 10 s histogram docs only (evidence_clock_tolerance_s
      #          applies to this path and to the fallback).
      # The controller must reach pod IP:metrics_port (no NetworkPolicy today).
      evidence_source: direct
      # Direct path: scrape period (s) and deadline-extension step.
      evidence_poll_s: 2
      # Direct path: timeout (s) of one pod scrape (concurrent; must be below
      # evidence_poll_s).
      scrape_timeout_s: 1
      # Direct path: the baseline scrape runs this long (ms) after the SM confirmed the
      # hide (the gateway applies it through its pod watch meanwhile); the deadline
      # still counts from the confirmation.
      baseline_delay_ms: 1000
      # Direct path: the model pods' serving port (the reissue sidecar forwards
      # GET /metrics to vLLM).
      metrics_port: 8000

    # Fast-loop scale-up (controller only; read at start, restart-to-apply; every key
    # optional, the values below are the built-in defaults). C1, design
    # docs/design/20261001-c1-deficit-scaleup.md. Controller / SM / UI images before
    # 2026-10-01 ignore this top-level section (the registry loader only reads the
    # sections it knows).
    scaling:
      # A CRITICAL receiver's rescue asks for its whole deficit at once: target
      # min(max(n+1, ceil(n * tau_crit / Z)), max(n+1, floor(ratio * n)), the scaling
      # cap max_awake_replicas, the capacity found), n = its routable replicas, Z its
      # decision-window signal. 0 = the legacy one step (ceil(0.1 * n)) per window.
      rescue_max_step_ratio: 2.0
      # The rescue target may also reach n + this many replicas: cap = max(n + 1,
      # floor(ratio * n), n + pods) (HPA's default "max(100%, +4 pods)" shape). 0 = off
      # (the built-in default); 4 = user decision 2026-10-01 (n = 1 can reach the
      # scaling cap 4 in one decision).
      rescue_max_step_pods: 4
      # An immediate IDLE / HIGH donor of a CRITICAL receiver gives its whole surplus
      # (IDLE to its floor, HIGH to its tau_high level) in one tick. false = one step
      # per tick (scale-down stays cautious).
      donor_surplus_release: false
      # A rescue target counts as reflected once the decision window starts
      # k * trs.ema_tau_ms after it completed (the EMA'd Z lags the window). 0 = the
      # window start alone.
      rescue_settle_ema_k: 2.0
      # Also hold a CRITICAL receiver's scale-up until a metrics window starting after
      # its last scale-up completed (the F4 cooldown, TRE_ACTION_COOLDOWN). Off: the
      # rescue target bookkeeping already keeps an unreflected scale-up from repeating.
      # Scale-down holds, LOW receivers and the slow loop keep the cooldown either way.
      scale_up_cooldown_enabled: false
      # O1 breakpoint-aware window (design docs/design/20261001-o1-breakpoint-window.md,
      # ADR-0015): a model decides on the part of its 30 s metrics window after its last
      # breakpoint (traffic onset, routable replica-count change), complete 10 s gateway
      # grids only (the grid holding the breakpoint excluded), the TSS numerator scaled to
      # a whole window and the EMA restarted at the breakpoint. Scale-ups act after
      # min_evidence_grids grids; scale-downs wait for a whole window after the breakpoint.
      # Replaces the ADR-0013 onset warmup guard. Controller images before O1 ignore these
      # keys (C1 images log them as unknown).
      breakpoint_window: true
      # The ADR-0013 onset warmup guard (TRE_SIGNAL_WARMUP_MS) on top of O1. With
      # breakpoint_window: false the guard always applies (= pre-O1 behaviour).
      onset_warmup_guard: false
      # Complete post-breakpoint grids before a scale-up decision (2 = 20 s).
      min_evidence_grids: 2
      # Completed requests the post-breakpoint window also needs (0 = off). Tokens count
      # at completion: one short request done while long ones run reads Z ~ 5 %.
      min_evidence_requests: 3
      # Added to a routable-count change time before it is rounded up to the 10 s grid:
      # the SM writes the routable label before it answers, the gateway applies it via
      # its pod informer shortly after.
      breakpoint_margin_ms: 1000
      # A C1 rescue decided on a partial (post-breakpoint) window with fewer than
      # breakpoint_lowevidence_requests completed requests adds at most
      # breakpoint_partial_max_step replicas; with more, the whole deficit at once.
      # breakpoint_partial_max_step: 0 = no cap.
      breakpoint_partial_max_step: 1
      breakpoint_lowevidence_requests: 10
      # After this many consecutive held 10 s windows a receiver decides on the whole
      # window again (routable count changing all the time); donors still wait. 0 = never.
      breakpoint_hold_max_windows: 6
      # Same-clock check of gateway doc stamps vs the controller clock (O1 compares them):
      # beyond the tolerance O1 is suspended (pre-O1 behaviour) until 3 good checks.
      gateway_clock_tolerance_ms: 2000
      gateway_clock_check_s: 60
    # Node GPU-truth agent DaemonSet (deploy/gen_gpu_truth_manifest.py renders
    # overlays/tre-v2/gpu-truth.yaml from this and cluster.nodes). Only the generator
    # reads this section; the controller, service-manager and UI ignore it.
    gpu_truth:
      # Agent image built from tre/gpu-truth/Dockerfile (build context tre/).
      image: tre-v2-gpu-truth:20261001-8d8b2565
kind: ConfigMap
metadata:
  name: tre-v2-registry
  namespace: tre-v2
