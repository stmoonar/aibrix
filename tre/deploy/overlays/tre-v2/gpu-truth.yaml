# Generated by tre/deploy/gen_gpu_truth_manifest.py from deploy/registry.yaml
# (gpu_truth.image, cluster.nodes). Do not edit by hand; regenerate with:
#   python3 deploy/gen_gpu_truth_manifest.py
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tre-v2-gpu-truth
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-gpu-truth
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tre-v2-gpu-truth
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tre-v2-gpu-truth
    spec:
      # hostPID stays false: the agent only reads nvidia-smi inside its own
      # container (GPUs injected via NVIDIA_VISIBLE_DEVICES), never the host PID ns.
      hostPID: false
      # Restrict to the TRE GPU nodes (registry cluster.nodes); other GPU nodes
      # in the cluster are out of TRE scope.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - nscc-ds-4a100-node9
                      - nscc-ds-4a100-node10
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: gpu-truth
          # Built from tre/gpu-truth/Dockerfile (python slim + the agent); no
          # CUDA userspace in the image, nvidia-smi / NVML come from the host
          # driver via the NVIDIA container runtime.
          image: tre-v2-gpu-truth:20261001-e14151b1
          imagePullPolicy: IfNotPresent
          command:
            - python3
            - /app/gpu_truth_agent.py
            - --redis-url
            - redis://tre-v2-redis:6379/0
            - --node
            - $(NODE_NAME)
            - --interval-s
            - "10"
            - --refresh-poll-s
            - "0.25"
            - --ttl-s
            - "120"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NVIDIA_VISIBLE_DEVICES
              value: all
            # utility = nvidia-smi + libnvidia-ml only (no compute libraries).
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: utility
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
