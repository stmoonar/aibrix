apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: tre-v2-redis
      namespace: tre-v2
      labels:
        app.kubernetes.io/name: tre-v2-redis
    spec:
      selector:
        app.kubernetes.io/name: tre-v2-redis
      ports:
        - name: redis
          port: 6379
          targetPort: 6379
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: tre-v2-redis
      namespace: tre-v2
      labels:
        app.kubernetes.io/name: tre-v2-redis
    spec:
      replicas: 1
      selector:
        matchLabels:
          app.kubernetes.io/name: tre-v2-redis
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tre-v2-redis
        spec:
          nodeSelector:
            kubernetes.io/hostname: nscc-ds-4a100-node10
          containers:
            - name: redis
              image: redis:7.2-alpine
              imagePullPolicy: IfNotPresent
              # 2026-10-29: no persistence. The pod has no volume, so an RDB snapshot is
              # never read back (a restarted pod starts empty either way); the periodic
              # fork + dump caused most of the container's CPU throttling.
              # args, not command: the image ENTRYPOINT (docker-entrypoint.sh) stays, so
              # redis still drops root (su-exec) and sets its umask.
              args: ["redis-server", "--save", "", "--appendonly", "no"]
              ports:
                - containerPort: 6379
                  name: redis
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 2Gi
