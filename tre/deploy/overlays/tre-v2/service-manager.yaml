apiVersion: apps/v1
kind: Deployment
metadata:
  name: tre-v2-service-manager
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-service-manager
spec:
  replicas: 1
  # One writer at a time: a surge replica would run its startup sleep-journal
  # recovery while the old one may still be draining.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tre-v2-service-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tre-v2-service-manager
    spec:
      serviceAccountName: tre-v2-service-manager
      # SIGTERM stops new sleeps and rolls back every drain that has not reached
      # /sleep (also the drain of a repair / defrag sleep); a commit already past
      # /sleep finishes. The SM waits ServiceManagerConfig.shutdown_timeout_s()
      # for that (commit-lock wait + parallel commit + one poll round, 150.5 s
      # with the registry defaults); the grace period must exceed it. Guard test:
      # deploy/tests/test_kustomize_overlays.py.
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: nscc-ds-4a100-node10
      containers:
        - name: service-manager
          image: tre-v2-service-manager:20261001-8b9d5980
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          env:
            - name: TRE_REDIS_URL
              value: redis://tre-v2-redis:6379/0
            # The live registry is the tre-v2-registry ConfigMap (mounted below), the
            # same one the controller reads: model bindings for desired-state seeding
            # (plan D7) and the service_manager: section (sleep/drain policy).
            - name: TRE_REGISTRY_PATH
              value: /etc/tre/registry.yaml
            # Model Deployments + their HTTPRoutes live in these namespaces.
            - name: TRE_MODEL_NAMESPACE
              value: default
            - name: TRE_ROUTE_NAMESPACE
              value: tre-v2
            - name: TRE_GATEWAY_NAME
              value: tre-aibrix-eg
            # --- D8/D10 GPU-truth governance thresholds (Plan B: SM reads
            # tre:gpu_truth:<node> from the same TRE Redis, written by the
            # gpu-truth DaemonSet). ---
            # Cold-start headroom comes from the registry (service_manager.create,
            # B9); TRE_CREATE_MAX_USED_MIB is an explicit override only - unset.
            - name: TRE_SLEEP_LEAK_USED_MIB
              value: "8192"
            - name: TRE_SM_SUPERVISOR_ENABLED
              value: "true"
            - name: TRE_SM_SUPERVISOR_INTERVAL_S
              value: "5"
            # Level of the SM's own loggers (tre_sm, tre_common); overrides the
            # registry's service_manager.log_level. uvicorn keeps its own config.
            - name: TRE_SM_LOG_LEVEL
              value: INFO
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: registry
              mountPath: /etc/tre
              readOnly: true
      volumes:
        # Non-optional: a missing ConfigMap blocks the pod instead of booting on
        # stale or absent bindings.
        - name: registry
          configMap:
            name: tre-v2-registry
---
apiVersion: v1
kind: Service
metadata:
  name: tre-v2-service-manager
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-service-manager
spec:
  selector:
    app.kubernetes.io/name: tre-v2-service-manager
  ports:
    - name: http
      port: 8000
      targetPort: 8000
