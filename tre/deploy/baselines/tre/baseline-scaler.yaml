apiVersion: apps/v1
kind: Deployment
metadata:
  name: tre-v2-baseline-scaler
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
spec:
  # Off by default. The campaign scales it to 1 for a baseline arm; at most one pod may
  # actuate (owner lock tre:v2:bl:owner), and Recreate avoids an old+new overlap.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tre-v2-baseline-scaler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tre-v2-baseline-scaler
    spec:
      serviceAccountName: tre-v2-baseline-scaler
      containers:
        - name: baseline-scaler
          image: tre-v2-baseline-scaler:20261006-43444853
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: TRE_BL_POLICY
              value: static
            # Decide and log only; set "false" (with the controller in observe) to actuate.
            - name: TRE_BL_DRY_RUN
              value: "true"
            - name: TRE_BL_TICK_S
              value: "2"
            - name: TRE_SM_URL
              value: http://tre-v2-service-manager:8000
            - name: TRE_REDIS_URL
              value: redis://tre-v2-redis:6379/0
            - name: TRE_REGISTRY_PATH
              value: /etc/tre/registry.yaml
            - name: TRE_BL_POLICY_CONFIG
              value: /etc/tre-baselines/$(TRE_BL_POLICY).yaml
            - name: TRE_BL_LOG_DIR
              value: /var/log/tre-baselines
            - name: TRE_BL_WRITE_REDIS
              value: "true"
            # Scale-downs sleep on a no-drain path (hide, gateway ack, /sleep mode=abort,
            # sidecar continuation) like every other arm; must be in the registry's
            # service_manager.sleep.no_drain_paths or the shell refuses to start.
            - name: TRE_BL_ABORT_SLEEP_PATH
              value: urgent
            - name: TRE_MODEL_NAMESPACE
              value: default
            - name: TRE_BL_HTTP_PORT
              value: "8080"
          # Readiness = the loop's ticks succeed (/healthz turns 503 after
          # TRE_BL_MAX_TICK_FAILURES failed ticks, e.g. while the SM is down). Liveness only
          # asks whether the process and its loop thread are alive (/livez), so an SM or
          # Redis outage never restarts the pod (which would drop the owner lock and the
          # in-memory policy state).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: registry
              mountPath: /etc/tre
              readOnly: true
            - name: policies
              mountPath: /etc/tre-baselines
              readOnly: true
            - name: decision-logs
              mountPath: /var/log/tre-baselines
            # PreServe Tier-1 reads the replayed trace from here (params.trace_path).
            - name: traces
              mountPath: /etc/tre-baselines-traces
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: registry
          configMap:
            name: tre-v2-registry
        - name: policies
          projected:
            sources:
              - configMap:
                  name: tre-v2-baseline-chiron
              - configMap:
                  name: tre-v2-baseline-tokenscale
              - configMap:
                  name: tre-v2-baseline-preserve
        # Decision JSONL; also mirrored to Redis (tre:v2:bl:decision:<model>, TTL 1 h, and
        # the stream tre:v2:bl:decisions). `arm disable --execute --collect-dir` copies the
        # files out before scaling to 0; or patch in a persistent volume.
        - name: decision-logs
          emptyDir: {}
        # Trace source of PreServe Tier-1. Empty by default (the image also carries
        # tre/replayer/traces_* under /app/tre/replayer); patch this volume with a
        # kustomize patch to a configMap / PVC / hostPath holding the campaign's traces
        # (see tre/baselines/README.md, "Trace volume").
        - name: traces
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tre-v2-baseline-scaler
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
spec:
  selector:
    app.kubernetes.io/name: tre-v2-baseline-scaler
  ports:
    - name: http
      port: 8080
      targetPort: 8080
