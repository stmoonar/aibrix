# Per-policy parameters, mounted together at /etc/tre-baselines/<policy>.yaml; the shell
# reads the file named by TRE_BL_POLICY_CONFIG.
#
# Chiron-global (code kept, not run in the 2026-10-26 campaign): FROZEN 2026-10-06 (branch
# feat/baseline-params-20261006) on images 20261006-bb54543e; theta_trace tools/chiron_theta
# --method peak_mean --interval-s 5 (CPU only); busy_band_h max(0.25, 3 sigma(sum_q) / B); batch_mode
# static, static_b 256 = engine max_num_seqs. Its theta / band were fitted on the old 492 / 400 shape.
#
# TokenScale-colocated and PreServe (v1 port, docs/campaign-v2-20261026-plan.md of the local workspace):
# `calibration: pending` until the GPU calibration (tools/velocity_ladder on the campaign's cells) is done;
# the policies refuse to start on a pending block. The blocks are written by
#   python3 -m tre_baselines.tools.freeze_params {tokenscale|preserve} ... --write
# (never edit them by hand); each block's first line names its sources' sha256.
# Do not change any value after a comparison has been seen.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-chiron
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  chiron.yaml: |
    batch_mode: static       # paper ablation: static per-instance batch size (Alg.1 virtual B collapses, S4 153 -> 1)
    static_b: 256            # = engine max_num_seqs (the engine batch size cannot change at run time)
    alpha: 0.5               # paper: Alg.1 smoothing factor (alg1 sensitivity row only)
    kv_request_tokens: 892   # in + out of one trace-shape request (492 + 400): caps the virtual B (alg1 only)
    busy_def: effective      # busy = ceil(sum(running+waiting) / mean B) (disclosed adaptation)
    theta:                   # theta_trace, peak_mean 5 s on the replayed hot alt trace
      dsqwen-7b: 0.4598
      dsllama-8b: 0.5343
      dsqwen-14b: 0.4598
    busy_band_h:             # max(0.25, 3 sigma(sum_q)/B), sanity S23 3x plateau, 30 s windows (7b sigma 28.8, B 251.4)
      dsqwen-7b: 0.34
      dsllama-8b: 0.34       # no plateau data: 7b value (sqrt(B) scaling would give 0.44)
      dsqwen-14b: 0.34       # (sqrt(B) scaling: 0.36)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-tokenscale
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  tokenscale.yaml: |
    # PENDING (tools/freeze_params tokenscale). Sources: none
    calibration: pending
    bucket_edges:            # paper (TokenScale Table II / DynamoLLM Table IV): in < 256 / < 1024 / else
      "*": {in: [255, 1023], out: [99, 349]}   # (> 8192 is long too), out < 100 / < 350 / >= 350
    bucket_centers:          # [in, out] per cell = mean of the campaign's requests in it (v1 D49), tools/tokenscale_buckets
      dsqwen-7b: null
      dsllama-8b: null
      dsqwen-14b: null
    velocity:                # (in+out) tok/s per replica at each centre: the PEAK of effective full steps
                             # (waiting slope > 2 % x offered rps, v1 D53; tools/velocity_ladder), no V_P (D51)
      dsqwen-7b: null
      dsllama-8b: null
      dsqwen-14b: null
    out_len_source: max_tokens  # the true output picks the bucket before the simulated error
    default_out_tokens: 256  # not in paper
    misbucket_rate: 0.15     # paper: 85 %-accurate length predictor; draw = hash(seed, model, client id)
    seed: 0
    skip_reissue: true
    window_s: 30             # = TRE TSS window (30 s); paper gives no value
    max_estimate_frac: 0.05  # not in paper
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-preserve
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  preserve.yaml: |
    # PENDING (tools/freeze_params preserve). Sources: none
    calibration: pending
    # The trace: replaced per run by the campaign runner (its oracle copy in the trace volume); the
    # history before t0 is next to it: pre_t0.json (synthetic, the generator's), else preserve_history.json
    # (Real_*, tools/preserve_history real); see tre_baselines.policies.preserve_history.
    trace_path: /etc/tre-baselines-traces/case/seed1/traces_tre.effective.json
    trace_seed: 0
    trace_schedule: poisson
    trace_match_parts: 2
    window_s: 30             # v1 D18 (paper 600 s; the traces are 12 min)
    lead_s: 0
    tier1: mlstm             # paper forecaster; v1 paper_past weights (train before the Real_* slices)
    seq_len: 25
    predictors:              # relative paths: under tre/baselines (in the image /app/tre/baselines)
      code: {path: weights/preserve-mlstm-20261024-paper/code-paper.npz, sha256: 3e70e4642829427ac5a528bfd6ff77e8e29335960adbab76832a6d5168251fb4}
      conv: {path: weights/preserve-mlstm-20261024-paper/conv-paper.npz, sha256: 64448df062646bbb0cbe0ce8936330509172046c4bd2ee568b595b4ad4dc4478}
      pooled: {path: weights/preserve-mlstm-20261024-paper/pooled-paper.npz, sha256: 0dfd5649600b2c86208528e3f0de5b19ac3266fc27af77c2189d6851134c1585}
    predictor_rules: [[Real_code, code], [Real_conv, conv]]   # any other trace: pooled
    mu:                      # tok/s per replica, PreServe Alg.1 on the V ladders: NL SLO = 3 x isolated NL,
                             # every request of a step, variant B (P share in the traces' p5-p95), tools/velocity_ladder mu
      dsqwen-7b: null
      dsllama-8b: null
      dsqwen-14b: null
    load_error_mode: paper_tab2   # paper RQ2 'PreServe w/ load errors' (Tab. 2 error model)
    load_error_seed: 0       # the same draws in every arm and replay seed (as TokenScale seed: 0)
    max_model_len: 131072
    map_factor: 1.2
    lookahead_iters: 100     # paper l
    kv_high: 0.95            # paper
    overload_frac: 0.10      # paper
    t_f: 0.30                # paper T_f
    out_len_is_upper_bound: false   # load errors: D_hat is a prediction (paper refinement)
    ext_frac: 0.2            # paper virtual extension
    t2_reset_at_window: true # v1 D54 #2
    kv_agree_tol: 0.15       # logged only (kv_disagree)
    req_ttl_s: 1800
