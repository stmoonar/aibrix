# Per-policy parameters, mounted together at /etc/tre-baselines/<policy>.yaml; the shell
# reads the file named by TRE_BL_POLICY_CONFIG. Empty until the parameters are measured
# (Chiron-global theta_trace, TokenScale-colocated V_b/V_P and bucket edges,
# PreServe-oracle mu and trace_path): those policies refuse to start on {} (fail closed).
# Freeze all of them in one config commit before any comparison.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-chiron
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  chiron.yaml: |
    {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-tokenscale
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  tokenscale.yaml: |
    {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-v2-baseline-preserve
  namespace: tre-v2
  labels:
    app.kubernetes.io/name: tre-v2-baseline-scaler
data:
  preserve.yaml: |
    {}
