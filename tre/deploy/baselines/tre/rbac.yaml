apiVersion: v1
kind: ServiceAccount
metadata:
  name: tre-v2-baseline-scaler
  namespace: tre-v2
---
# Read-only: the shell lists the model pods (label tre.aibrix.io/routable=true) to learn
# their addresses; it scales only through the service manager HTTP API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tre-v2-baseline-scaler-pods
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tre-v2-baseline-scaler-pods
  namespace: default
subjects:
  - kind: ServiceAccount
    name: tre-v2-baseline-scaler
    namespace: tre-v2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tre-v2-baseline-scaler-pods
