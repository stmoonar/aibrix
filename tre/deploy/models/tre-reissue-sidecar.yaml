apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-reissue-sidecar
  namespace: default
  labels:
    tre.aibrix.io/managed: 'true'
    app.kubernetes.io/name: tre-reissue-sidecar
data:
  sidecar.py: "#!/usr/bin/env python3\n\"\"\"TRE retry / continuation sidecar (plan\
    \ 2026-09-27 D5, D6).\n\nRuns in every model pod next to vLLM. The sidecar owns\
    \ the pod's serving port (default\n8000) and vLLM moves to a local port (default\
    \ 127.0.0.1:8001), so the Service, the gateway\n(target-pod = podIP:8000), the\
    \ service-manager, metric scrapers and probes are unchanged.\nEvery path is proxied\
    \ transparently (streaming kept). On top of that:\n\n* Not-yet-started requests\
    \ are RETRIED through the TRE gateway, unchanged, with\n  ``x-tre-exclude-pod:\
    \ <this pod>`` merged into the request: when vLLM answers\n  ``503 {\"error\"\
    : {\"type\": \"EngineSleeping\"}}`` (fork flag ``--sleep-reject-new``, also as\n\
    \  the first event of an SSE stream), when the local engine is known to be asleep,\
    \ or when\n  a generation is aborted before a single byte reached the client.\
    \ Bounded attempts; if\n  all fail the client gets ``503`` + ``Retry-After``.\n\
    * Started requests aborted by a sleep (``finish_reason == \"abort\"`` after a\
    \ ``/sleep`` call\n  reached this sidecar since the request started) are CONTINUED\
    \ on another instance through the gateway with a token-id prompt:\n  ``prompt\
    \ = prompt_token_ids + generated_token_ids`` (both from the abort output of the\n\
    \  fork flag ``--abort-return-token-ids``), ``max_tokens`` reduced by the generated\
    \ count,\n  the same sampling parameters. Chat requests are continued as ``/v1/completions``\
    \ over the\n  engine-rendered prompt ids (exact seam) and the chunks are reshaped\
    \ back into chat\n  chunks. The two segments are stitched (one id / created /\
    \ model, one [DONE], merged\n  usage with the ORIGINAL prompt_tokens, stop strings\
    \ re-checked across the seam).\n* The loopback hop to vLLM is kept healthy: pooled\
    \ connections idle at most\n  ``upstream_keepalive_s`` (below vLLM's own keep-alive),\
    \ a request whose pooled\n  connection is dropped before the first response byte\
    \ (and within\n  ``local_reconnect_window_s`` of being handed out) is re-sent\
    \ once on a fresh\n  connection, and if the engine still cannot be reached before\
    \ anything was sent the\n  client gets ``503`` + ``Retry-After`` (``error.layer\
    \ = \"sidecar_upstream\"``), or the\n  request goes through the gateway when nothing\
    \ listens locally / the pod is asleep.\n* The hop Envoy -> sidecar is kept healthy\
    \ the same way round: the sidecar's own server\n  keeps an idle connection ``server_keepalive_s``\
    \ (default 75 s), which must stay above\n  Envoy's upstream idle timeout (``gateway.upstream_idle_timeout_s``,\
    \ default 60 s), so\n  Envoy - the side that sends requests - always closes an\
    \ idle connection first.\n* ``POST /sleep`` (and ``/pause``) must carry ``X-TRE-Hidden:\
    \ 1`` (sent by the\n  service-manager after it hid the pod), else 409: fail closed.\n\
    * A client that goes away cancels its request: the server cancels the handler\
    \ on a lost\n  connection and every upstream request it holds (local engine, gateway\
    \ retry or\n  continuation) is closed, so vLLM aborts it (a queued request is\
    \ not prefilled). An\n  upstream break caused by a sleep, with the client still\
    \ there, is continued as above.\n* At startup the soft open-files limit is raised\
    \ to ``nofile_target`` (capped at the hard\n  limit), as vLLM does: some container\
    \ runtimes start processes with soft 1024.\n* ``GET /tre-reissue/metrics`` (Prometheus\
    \ text), ``GET /tre-reissue/state``, one JSON log\n  line per retry / continuation\
    \ on stdout.\n\nHow the sidecar knows the pod is asleep: the only way to put the\
    \ engine to sleep is a\n``/sleep`` through this sidecar (vLLM listens on localhost),\
    \ so the sidecar marks the pod\nsleeping BEFORE it forwards the call (the abort\
    \ outputs arrive before /sleep returns) and\nclears the mark on a successful ``/wake_up``.\
    \ The mark is re-synced from every proxied\n``/is_sleeping`` answer, a periodic\
    \ direct ``/is_sleeping`` probe and every EngineSleeping\n503 (vLLM or sidecar\
    \ restarts). The route-gen / hidden pod annotation is not used: the\ndownward\
    \ API refreshes annotation files only on the kubelet sync period (up to a minute).\n\
    \nDesign and field names: tre/docs/design/20260927-reissue-sidecar-v2.md. Every\
    \ endpoint,\nport, header and JSON field name is configurable through ``TRE_REISSUE_*``\
    \ environment\nvariables (``TRE_GATEWAY_URL`` for the gateway). Only the standard\
    \ library and aiohttp\nare used (both ship in the vLLM image), so the script is\
    \ delivered through a ConfigMap.\nPython >= 3.10.\n\"\"\"\nfrom __future__ import\
    \ annotations\n\nimport asyncio\nimport dataclasses\nimport errno\nimport json\n\
    import os\nimport sys\nimport time\nfrom collections import deque\nfrom dataclasses\
    \ import dataclass\nfrom typing import Any\n\nimport aiohttp\nfrom aiohttp import\
    \ web\n\ntry:\n    import resource\nexcept ImportError:  # not POSIX: the open-files\
    \ limit is left alone\n    resource = None  # type: ignore[assignment]\n\n#: The\
    \ stable ClusterIP Service in front of the tre-v2 Envoy proxy (tre-v2 overlay\n\
    #: gateway-service.yaml; registry gateway.service_name / service_namespace). Override\
    \ with\n#: TRE_GATEWAY_URL, which the manifests render from the registry.\nDEFAULT_GATEWAY_URL\
    \ = \"http://tre-gateway.envoy-gateway-system.svc.cluster.local:80\"\n\n#: vLLM's\
    \ /v1/completions default when max_tokens is absent or null.\nCOMPLETIONS_DEFAULT_MAX_TOKENS\
    \ = 16\n\n#: Never copied between hops (RFC 7230 hop-by-hop plus what aiohttp\
    \ recomputes).\nHOP_BY_HOP = frozenset(\n    {\n        \"connection\",\n    \
    \    \"keep-alive\",\n        \"proxy-authenticate\",\n        \"proxy-authorization\"\
    ,\n        \"proxy-connection\",\n        \"te\",\n        \"trailer\",\n    \
    \    \"trailers\",\n        \"transfer-encoding\",\n        \"upgrade\",\n   \
    \     \"host\",\n        \"content-length\",\n    }\n)\n#: Additionally dropped\
    \ from requests sent to the gateway: per-hop identity and the\n#: routing decision\
    \ made for the ORIGINAL request.\n_GATEWAY_DROP_BASE = HOP_BY_HOP | frozenset(\n\
    \    {\n        \"x-request-id\",\n        \"target-pod\",\n        \"x-forwarded-for\"\
    ,\n        \"x-forwarded-proto\",\n        \"x-forwarded-host\",\n        \"x-forwarded-port\"\
    ,\n        \"x-real-ip\",\n    }\n)\n_RESPONSE_DROP = HOP_BY_HOP | frozenset({\"\
    server\", \"date\"})\n\n#: Sampling / output parameters that mean the same on\
    \ chat and completions requests;\n#: copied when a chat request is continued as\
    \ a token-id completion.\nCHAT_TO_COMPLETION_KEYS = (\n    \"model\",\n    \"\
    temperature\",\n    \"top_p\",\n    \"top_k\",\n    \"min_p\",\n    \"seed\",\n\
    \    \"stop\",\n    \"stop_token_ids\",\n    \"ignore_eos\",\n    \"presence_penalty\"\
    ,\n    \"frequency_penalty\",\n    \"repetition_penalty\",\n    \"length_penalty\"\
    ,\n    \"logit_bias\",\n    \"bad_words\",\n    \"allowed_token_ids\",\n    \"\
    skip_special_tokens\",\n    \"spaces_between_special_tokens\",\n    \"include_stop_str_in_output\"\
    ,\n    \"min_tokens\",\n    \"user\",\n    \"priority\",\n    \"cache_salt\",\n\
    \    \"vllm_xargs\",\n    \"return_token_ids\",\n    \"stream_options\",\n)\n\
    #: Removed from a completions request continued with a token-id prompt.\nCOMPLETION_CONT_DROP\
    \ = (\"prompt\", \"prompt_embeds\", \"echo\", \"suffix\", \"truncate_prompt_tokens\"\
    , \"add_special_tokens\")\n\n_ABORT_MARK = b'\"abort\"'\n\n#: Start of the message\
    \ of every error response the sidecar itself produces (``_error``).\nSIDECAR_ERROR_PREFIX\
    \ = \"tre-reissue sidecar:\"\n#: In the message of a sidecar 503 that is FINAL:\
    \ that sidecar already spent its bounded\n#: gateway retries (retry_exhausted)\
    \ or the hop limit is reached (depth_limit). A 502 / 503\n#: carrying it is not\
    \ retried by the sidecar before it (``ReissueSidecar._gateway_request``).\n#:\
    \ A plain token, no quotes or backslashes: the TRE gateway plugin replaces an\
    \ upstream\n#: error body with its own OpenAI error whose message is the original\
    \ body as a JSON\n#: string (escaped) and drops the upstream headers, so only\
    \ a substring survives.\nFINAL_ERROR_MARK = \"tre_reissue_final\"\n_FINAL_ERROR_MARK_B\
    \ = FINAL_ERROR_MARK.encode()\n\n\n\ndef _request_key(name: str, kind: type) ->\
    \ Any:\n    \"\"\"A ``web.Request`` item key (aiohttp < 3.12 has no ``web.RequestKey``:\
    \ a string).\"\"\"\n    return web.RequestKey(name, kind) if hasattr(web, \"RequestKey\"\
    ) else name\n\n\n#: Per-request: the tre_reissue_total kind owed for a request\
    \ whose retry / continuation\n#: is under way; ``_account`` clears it. If the\
    \ client goes away first, the request is\n#: accounted as ``(kind, \"client_gone\"\
    )``.\n_REISSUE_PENDING = _request_key(\"tre_reissue_pending\", str)\n#: Per-request:\
    \ the client has the complete response (the stream's ``[DONE]`` is\n#: written);\
    \ a cancel after that (the engine had not ended its response yet) is not a\n#:\
    \ client cancel.\n_DELIVERED = _request_key(\"tre_reissue_delivered\", bool)\n\
    \nOVERHEAD_BUCKETS_S = (\n    0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025,\
    \ 0.005, 0.01, 0.05, 0.1, 0.25, 1.0,\n)\nGAP_BUCKETS_S = (0.05, 0.1, 0.25, 0.5,\
    \ 1.0, 2.0, 5.0, 10.0, 30.0, 60.0)\n\n\n# ----------------------------------------------------------------------------\
    \ config\n\n\ndef _truthy(value: str) -> bool:\n    return value.strip().lower()\
    \ in {\"1\", \"true\", \"yes\", \"on\"}\n\n\n@dataclass(frozen=True)\nclass Config:\n\
    \    \"\"\"Every field ``foo`` is read from ``TRE_REISSUE_FOO`` (see ``from_env``).\"\
    \"\"\n\n    listen_host: str = \"0.0.0.0\"\n    #: The pod's serving port (Service\
    \ targetPort, gateway target-pod, SM, probes).\n    listen_port: int = 8000\n\
    \    #: The local vLLM (moved to the internal port).\n    upstream_url: str =\
    \ \"http://127.0.0.1:8001\"\n    #: TRE gateway, in-cluster DNS name (env TRE_GATEWAY_URL).\n\
    \    gateway_url: str = DEFAULT_GATEWAY_URL\n    model: str = \"\"\n    #: This\
    \ pod's name (env POD_NAME, downward API): the x-tre-exclude-pod value.\n    pod_name:\
    \ str = \"\"\n    #: False = pure transparent proxy (still tracks sleep; never\
    \ retries / continues).\n    enabled: bool = True\n    #: Max retry / continuation\
    \ hops a request may take (x-tre-reissue-depth).\n    max_depth: int = 3\n   \
    \ #: Gateway attempts per retry or continuation request (503 / 502 / connect errors).\n\
    \    retry_attempts: int = 4\n    retry_backoff_s: float = 0.2\n    #: Cap of\
    \ the backoff and of an honoured Retry-After between attempts.\n    retry_max_backoff_s:\
    \ float = 2.0\n    #: Refuse /sleep and /pause without ``X-TRE-Hidden: 1`` (409).\n\
    \    require_hidden_header: bool = True\n    #: Context limit for chat continuations\
    \ without a token limit; 0 = ask vLLM\n    #: (GET /v1/models, cached).\n    max_model_len:\
    \ int = 0\n    probe_interval_s: float = 2.0\n    #: Idle keep-alive of the pooled\
    \ connections to the local vLLM. Must stay BELOW vLLM's\n    #: own keep-alive\
    \ (``upstream_server_keepalive_s``): uvicorn closes an idle connection\n    #:\
    \ after that, and a pooled connection reused just as the server closes it fails\
    \ before\n    #: the first response byte (Server disconnected / Connection reset\
    \ by peer).\n    upstream_keepalive_s: float = 2.0\n    #: vLLM's keep-alive (its\
    \ VLLM_HTTP_TIMEOUT_KEEP_ALIVE; vLLM's default is 5 s). The\n    #: manifests\
    \ render it from the vLLM container env; only used for the startup check.\n  \
    \  upstream_server_keepalive_s: float = 5.0\n    #: Re-sends on a FRESH connection\
    \ when a request to the local vLLM failed at the\n    #: connection level (disconnect\
    \ / ECONNRESET / EPIPE) before any response byte and\n    #: before anything was\
    \ written to the client. 0 = off.\n    local_reconnect_attempts: int = 1\n   \
    \ #: A fresh-connection re-send happens only when the failure came within this\
    \ many\n    #: seconds of the pooled connection being handed to the request. The\
    \ keep-alive race\n    #: is instantaneous (the peer closed the idle connection\
    \ a moment ago); a reused\n    #: connection that dies later (engine crash mid-generation)\
    \ may have run the request,\n    #: so it is not re-sent. Must be >= 0.\n    local_reconnect_window_s:\
    \ float = 1.0\n    #: Keep-alive of THIS sidecar's HTTP server (aiohttp ``keepalive_timeout``):\
    \ how long\n    #: it keeps an idle client connection (Envoy's upstream connection)\
    \ open. The peer\n    #: that sends requests must close first, so this must stay\
    \ ABOVE Envoy's upstream idle\n    #: timeout (``gateway_upstream_idle_s``), else\
    \ Envoy reuses a connection the sidecar is\n    #: closing (503 UC / reset). aiohttp's\
    \ own default is 75 s.\n    server_keepalive_s: float = 75.0\n    #: Envoy's upstream\
    \ connection idle timeout (registry ``gateway.upstream_idle_timeout_s``,\n   \
    \ #: set on the tre-v2 gateway clusters). Only used for the startup check against\n\
    \    #: ``server_keepalive_s``; 0 = unknown, no check.\n    gateway_upstream_idle_s:\
    \ float = 0.0\n    #: Minimum seconds between two WARNING lines of the same kind\
    \ (rate limit).\n    warn_interval_s: float = 10.0\n    connect_timeout_s: float\
    \ = 6.0\n    #: Total timeout of proxied control / metadata calls (/health, /metrics,\
    \ ...).\n    proxy_timeout_s: float = 60.0\n    #: Total timeout of /sleep, /pause,\
    \ /wake_up, /resume.\n    control_timeout_s: float = 300.0\n    client_max_size:\
    \ int = 64 * 1024 * 1024\n    #: At startup the soft RLIMIT_NOFILE is raised to\
    \ min(this, hard limit), never lowered\n    #: (vLLM does the same and gets 65535).\
    \ Each request in flight holds two or three\n    #: sockets, and some container\
    \ runtimes start processes with soft 1024 (Docker >= 25 /\n    #: containerd >=\
    \ 2.0); a pod spec cannot set ulimits. 0 = leave the limit alone.\n    nofile_target:\
    \ int = 65535\n    # --- protocol names (defaults = vLLM >= 0.30 fork + TRE gateway\
    \ plugin) ---\n    completions_path: str = \"/v1/completions\"\n    chat_path:\
    \ str = \"/v1/chat/completions\"\n    #: POSTs under this prefix are retried when\
    \ the engine is asleep.\n    retry_path_prefix: str = \"/v1/\"\n    sleep_paths:\
    \ tuple[str, ...] = (\"/sleep\", \"/pause\")\n    wake_paths: tuple[str, ...]\
    \ = (\"/wake_up\", \"/resume\")\n    is_sleeping_path: str = \"/is_sleeping\"\n\
    \    models_path: str = \"/v1/models\"\n    metrics_path: str = \"/tre-reissue/metrics\"\
    \n    state_path: str = \"/tre-reissue/state\"\n    hidden_header: str = \"X-TRE-Hidden\"\
    \n    exclude_header: str = \"x-tre-exclude-pod\"\n    continued_header: str =\
    \ \"x-tre-continued\"\n    retried_header: str = \"x-tre-retried\"\n    depth_header:\
    \ str = \"x-tre-reissue-depth\"\n    #: Extension field on the final (finish_reason)\
    \ chunk of a continued stream.\n    continued_field: str = \"tre_continued\"\n\
    \    #: Error type of the fork's 503 for requests reaching a sleeping engine.\n\
    \    sleeping_error_type: str = \"EngineSleeping\"\n    #: Abort chunk (stream):\
    \ all generated token ids, in choices[i].\n    generated_ids_field: str = \"generated_token_ids\"\
    \n    #: Abort output: prompt token ids (chat: top level; completions: in choices[i]).\n\
    \    prompt_ids_field: str = \"prompt_token_ids\"\n    #: Aborted non-streaming\
    \ response: generated token ids in choices[i].\n    token_ids_field: str = \"\
    token_ids\"\n\n    @classmethod\n    def from_env(cls, env: dict[str, str] | None\
    \ = None) -> \"Config\":\n        env = dict(os.environ if env is None else env)\n\
    \        values: dict[str, Any] = {}\n        for f in dataclasses.fields(cls):\n\
    \            raw = env.get(\"TRE_REISSUE_\" + f.name.upper())\n            if\
    \ f.name == \"gateway_url\":\n                raw = env.get(\"TRE_GATEWAY_URL\"\
    ) or raw\n            elif f.name == \"pod_name\":\n                raw = env.get(\"\
    POD_NAME\") or raw or env.get(\"HOSTNAME\")\n            if raw is None or raw\
    \ == \"\":\n                continue\n            default = f.default\n      \
    \      if isinstance(default, bool):\n                values[f.name] = _truthy(raw)\n\
    \            elif isinstance(default, int):\n                values[f.name] =\
    \ int(raw)\n            elif isinstance(default, float):\n                values[f.name]\
    \ = float(raw)\n            elif isinstance(default, tuple):\n               \
    \ values[f.name] = tuple(p.strip() for p in raw.split(\",\") if p.strip())\n \
    \           else:\n                values[f.name] = raw.strip()\n        cfg =\
    \ cls(**values)\n        cfg = dataclasses.replace(\n            cfg, upstream_url=cfg.upstream_url.rstrip(\"\
    /\"), gateway_url=cfg.gateway_url.rstrip(\"/\")\n        )\n        if cfg.max_depth\
    \ < 0 or cfg.retry_attempts < 1:\n            raise ValueError(\"TRE_REISSUE_MAX_DEPTH\
    \ must be >= 0 and TRE_REISSUE_RETRY_ATTEMPTS >= 1\")\n        if not cfg.upstream_keepalive_s\
    \ > 0 or cfg.local_reconnect_attempts < 0:\n            raise ValueError(\"TRE_REISSUE_UPSTREAM_KEEPALIVE_S\
    \ must be > 0 and \"\n                             \"TRE_REISSUE_LOCAL_RECONNECT_ATTEMPTS\
    \ >= 0\")\n        if cfg.local_reconnect_window_s < 0:\n            raise ValueError(\"\
    TRE_REISSUE_LOCAL_RECONNECT_WINDOW_S must be >= 0\")\n        if not cfg.server_keepalive_s\
    \ > 0 or cfg.gateway_upstream_idle_s < 0:\n            raise ValueError(\"TRE_REISSUE_SERVER_KEEPALIVE_S\
    \ must be > 0 and \"\n                             \"TRE_REISSUE_GATEWAY_UPSTREAM_IDLE_S\
    \ >= 0\")\n        if cfg.nofile_target < 0:\n            raise ValueError(\"\
    TRE_REISSUE_NOFILE_TARGET must be >= 0\")\n        if not cfg.gateway_url.startswith((\"\
    http://\", \"https://\")):\n            raise ValueError(f\"TRE_GATEWAY_URL must\
    \ be an http(s) URL, got {cfg.gateway_url!r}\")\n        return cfg\n\n\n# ---------------------------------------------------------------------------\
    \ metrics\n\n\nclass Histogram:\n    def __init__(self, buckets: tuple[float,\
    \ ...]) -> None:\n        self.buckets = buckets\n        self.counts = [0] *\
    \ len(buckets)\n        self.sum = 0.0\n        self.count = 0\n\n    def observe(self,\
    \ value: float) -> None:\n        self.sum += value\n        self.count += 1\n\
    \        for index, bound in enumerate(self.buckets):\n            if value <=\
    \ bound:\n                self.counts[index] += 1\n\n    def render(self, name:\
    \ str, labels: str) -> list[str]:\n        lines = [f'{name}_bucket{{{labels},le=\"\
    {b}\"}} {c}' for b, c in zip(self.buckets, self.counts)]\n        lines.append(f'{name}_bucket{{{labels},le=\"\
    +Inf\"}} {self.count}')\n        lines.append(f\"{name}_sum{{{labels}}} {self.sum:.6f}\"\
    )\n        lines.append(f\"{name}_count{{{labels}}} {self.count}\")\n        return\
    \ lines\n\n\nclass AddedTime:\n    \"\"\"Time the sidecar itself adds to one request\
    \ (``tre_reissue_proxy_added_seconds``).\n\n    * ``forward``: from the full client\
    \ request read to the moment the request is\n      handed to the upstream HTTP\
    \ client (JSON parse, classification, headers);\n    * ``relay``: summed over\
    \ the upstream response - from receiving the upstream\n      headers / each upstream\
    \ chunk to finishing writing it (or the rewritten\n      events) to the client,\
    \ including the sidecar's own SSE / abort processing.\n\n    Waiting on upstream\
    \ is excluded: connection setup and body upload inside the\n    upstream client,\
    \ the time to the response headers (for a non-streaming\n    request: the whole\
    \ generation) and the gaps between chunks, and the\n    continuation request through\
    \ the gateway. A chunk write returns once aiohttp\n    has buffered it; it only\
    \ waits for the socket when the transport's write\n    buffer is above its high-water\
    \ mark, so a slow client's backpressure can show\n    up in ``relay``. Only requests\
    \ answered by the local engine are observed; a\n    retried request (sent on through\
    \ the gateway) is not.\n    \"\"\"\n\n    __slots__ = (\"forward\", \"relay\"\
    , \"relayed\", \"_started\", \"_mark\")\n\n    def __init__(self) -> None:\n \
    \       self.forward = 0.0\n        self.relay = 0.0\n        self.relayed = False\n\
    \        self._started = time.perf_counter()\n        self._mark: float | None\
    \ = None\n\n    def forwarded(self) -> None:\n        \"\"\"The request is handed\
    \ to the upstream client now.\"\"\"\n        self.forward = time.perf_counter()\
    \ - self._started\n\n    def start(self) -> None:\n        \"\"\"Upstream data\
    \ (headers or a chunk) received: sidecar work starts.\"\"\"\n        self.relayed\
    \ = True\n        self._mark = time.perf_counter()\n\n    def stop(self) -> None:\n\
    \        \"\"\"That data was written to the client (or the sidecar stopped to\
    \ wait on\n        upstream again).\"\"\"\n        if self._mark is not None:\n\
    \            self.relay += time.perf_counter() - self._mark\n            self._mark\
    \ = None\n\n    def discard(self) -> None:\n        \"\"\"The request is retried\
    \ elsewhere: not a locally answered request.\"\"\"\n        self.relayed = False\n\
    \        self._mark = None\n\n    @property\n    def total(self) -> float:\n \
    \       return self.forward + self.relay\n\n\nclass Metrics:\n    KINDS = (\"\
    retry\", \"continue\", \"failed\", \"passthrough_abort\")\n\n    def __init__(self,\
    \ model: str) -> None:\n        self.model = model\n        self.reissue: dict[tuple[str,\
    \ str], int] = {}\n        self.events: dict[str, int] = {}\n        #: forward\
    \ + relay per request (see :class:`AddedTime`), and the two parts.\n        self.overhead\
    \ = Histogram(OVERHEAD_BUCKETS_S)\n        self.forward = Histogram(OVERHEAD_BUCKETS_S)\n\
    \        self.relay = Histogram(OVERHEAD_BUCKETS_S)\n        #: Abort -> continuation,\
    \ per ``mode``: \"stream\" = to the FIRST continuation token\n        #: (the\
    \ client sees it at once); \"nonstream\" = to the COMPLETE continuation\n    \
    \    #: response (the client only sees anything then), so it also contains the\n\
    \        #: continued generation time. The two are not comparable.\n        self.gap\
    \ = {\"stream\": Histogram(GAP_BUCKETS_S), \"nonstream\": Histogram(GAP_BUCKETS_S)}\n\
    \        #: Fresh-connection re-sends to the local engine, per attempt (see\n\
    \        #: ``ReissueSidecar._local_request``).\n        self.reconnect: dict[str,\
    \ int] = {\"ok\": 0, \"fail\": 0}\n        #: Stale-connection failures on a reused\
    \ connection NOT re-sent because they came\n        #: later than ``local_reconnect_window_s``\
    \ after the connection was handed out.\n        self.reconnect_outside_window\
    \ = 0\n\n    def observe_added(self, added: \"AddedTime\") -> None:\n        added.stop()\n\
    \        if not added.relayed:\n            return\n        self.overhead.observe(added.total)\n\
