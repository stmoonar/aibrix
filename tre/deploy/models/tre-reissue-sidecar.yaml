apiVersion: v1
kind: ConfigMap
metadata:
  name: tre-reissue-sidecar
  namespace: default
  labels:
    tre.aibrix.io/managed: 'true'
    app.kubernetes.io/name: tre-reissue-sidecar
data:
  sidecar.py: "#!/usr/bin/env python3\n\"\"\"TRE retry / continuation sidecar (plan\
    \ 2026-09-27 D5, D6).\n\nRuns in every model pod next to vLLM. The sidecar owns\
    \ the pod's serving port (default\n8000) and vLLM moves to a local port (default\
    \ 127.0.0.1:8001), so the Service, the gateway\n(target-pod = podIP:8000), the\
    \ service-manager, metric scrapers and probes are unchanged.\nEvery path is proxied\
    \ transparently (streaming kept). On top of that:\n\n* Not-yet-started requests\
    \ are RETRIED through the TRE gateway, unchanged, with\n  ``x-tre-exclude-pod:\
    \ <this pod>`` merged into the request: when vLLM answers\n  ``503 {\"error\"\
    : {\"type\": \"EngineSleeping\"}}`` (fork flag ``--sleep-reject-new``, also as\n\
    \  the first event of an SSE stream), when the local engine is known to be asleep,\
    \ or when\n  a generation is aborted before a single byte reached the client.\
    \ Bounded attempts; if\n  all fail the client gets ``503`` + ``Retry-After``.\n\
    * Started requests aborted by a sleep (``finish_reason == \"abort\"`` while this\
    \ pod is\n  sleeping) are CONTINUED on another instance through the gateway with\
    \ a token-id prompt:\n  ``prompt = prompt_token_ids + generated_token_ids`` (both\
    \ from the abort output of the\n  fork flag ``--abort-return-token-ids``), ``max_tokens``\
    \ reduced by the generated count,\n  the same sampling parameters. Chat requests\
    \ are continued as ``/v1/completions`` over the\n  engine-rendered prompt ids\
    \ (exact seam) and the chunks are reshaped back into chat\n  chunks. The two segments\
    \ are stitched (one id / created / model, one [DONE], merged\n  usage with the\
    \ ORIGINAL prompt_tokens, stop strings re-checked across the seam).\n* ``POST\
    \ /sleep`` (and ``/pause``) must carry ``X-TRE-Hidden: 1`` (sent by the\n  service-manager\
    \ after it hid the pod), else 409: fail closed.\n* ``GET /tre-reissue/metrics``\
    \ (Prometheus text), ``GET /tre-reissue/state``, one JSON log\n  line per retry\
    \ / continuation on stdout.\n\nHow the sidecar knows the pod is asleep: the only\
    \ way to put the engine to sleep is a\n``/sleep`` through this sidecar (vLLM listens\
    \ on localhost), so the sidecar marks the pod\nsleeping BEFORE it forwards the\
    \ call (the abort outputs arrive before /sleep returns) and\nclears the mark on\
    \ a successful ``/wake_up``. The mark is re-synced from every proxied\n``/is_sleeping``\
    \ answer, a periodic direct ``/is_sleeping`` probe and every EngineSleeping\n\
    503 (vLLM or sidecar restarts). The route-gen / hidden pod annotation is not used:\
    \ the\ndownward API refreshes annotation files only on the kubelet sync period\
    \ (up to a minute).\n\nDesign and field names: tre/docs/design/20260927-reissue-sidecar-v2.md.\
    \ Every endpoint,\nport, header and JSON field name is configurable through ``TRE_REISSUE_*``\
    \ environment\nvariables (``TRE_GATEWAY_URL`` for the gateway). Only the standard\
    \ library and aiohttp\nare used (both ship in the vLLM image), so the script is\
    \ delivered through a ConfigMap.\nPython >= 3.10.\n\"\"\"\nfrom __future__ import\
    \ annotations\n\nimport asyncio\nimport dataclasses\nimport json\nimport os\n\
    import sys\nimport time\nfrom collections import deque\nfrom dataclasses import\
    \ dataclass\nfrom typing import Any\n\nimport aiohttp\nfrom aiohttp import web\n\
    \n#: The stable ClusterIP Service in front of the tre-v2 Envoy proxy (tre-v2 overlay\n\
    #: gateway-service.yaml; registry gateway.service_name / service_namespace). Override\
    \ with\n#: TRE_GATEWAY_URL, which the manifests render from the registry.\nDEFAULT_GATEWAY_URL\
    \ = \"http://tre-gateway.envoy-gateway-system.svc.cluster.local:80\"\n\n#: vLLM's\
    \ /v1/completions default when max_tokens is absent or null.\nCOMPLETIONS_DEFAULT_MAX_TOKENS\
    \ = 16\n\n#: Never copied between hops (RFC 7230 hop-by-hop plus what aiohttp\
    \ recomputes).\nHOP_BY_HOP = frozenset(\n    {\n        \"connection\",\n    \
    \    \"keep-alive\",\n        \"proxy-authenticate\",\n        \"proxy-authorization\"\
    ,\n        \"proxy-connection\",\n        \"te\",\n        \"trailer\",\n    \
    \    \"trailers\",\n        \"transfer-encoding\",\n        \"upgrade\",\n   \
    \     \"host\",\n        \"content-length\",\n    }\n)\n#: Additionally dropped\
    \ from requests sent to the gateway: per-hop identity and the\n#: routing decision\
    \ made for the ORIGINAL request.\n_GATEWAY_DROP_BASE = HOP_BY_HOP | frozenset(\n\
    \    {\n        \"x-request-id\",\n        \"target-pod\",\n        \"x-forwarded-for\"\
    ,\n        \"x-forwarded-proto\",\n        \"x-forwarded-host\",\n        \"x-forwarded-port\"\
    ,\n        \"x-real-ip\",\n    }\n)\n_RESPONSE_DROP = HOP_BY_HOP | frozenset({\"\
    server\", \"date\"})\n\n#: Sampling / output parameters that mean the same on\
    \ chat and completions requests;\n#: copied when a chat request is continued as\
    \ a token-id completion.\nCHAT_TO_COMPLETION_KEYS = (\n    \"model\",\n    \"\
    temperature\",\n    \"top_p\",\n    \"top_k\",\n    \"min_p\",\n    \"seed\",\n\
    \    \"stop\",\n    \"stop_token_ids\",\n    \"ignore_eos\",\n    \"presence_penalty\"\
    ,\n    \"frequency_penalty\",\n    \"repetition_penalty\",\n    \"length_penalty\"\
    ,\n    \"logit_bias\",\n    \"bad_words\",\n    \"allowed_token_ids\",\n    \"\
    skip_special_tokens\",\n    \"spaces_between_special_tokens\",\n    \"include_stop_str_in_output\"\
    ,\n    \"min_tokens\",\n    \"user\",\n    \"priority\",\n    \"cache_salt\",\n\
    \    \"vllm_xargs\",\n    \"return_token_ids\",\n    \"stream_options\",\n)\n\
    #: Removed from a completions request continued with a token-id prompt.\nCOMPLETION_CONT_DROP\
    \ = (\"prompt\", \"prompt_embeds\", \"echo\", \"suffix\", \"truncate_prompt_tokens\"\
    , \"add_special_tokens\")\n\n_ABORT_MARK = b'\"abort\"'\n\nOVERHEAD_BUCKETS_S\
    \ = (0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.05)\nGAP_BUCKETS_S\
    \ = (0.05, 0.1, 0.25, 0.5, 1.0, 2.0, 5.0, 10.0, 30.0, 60.0)\n\n\n# ----------------------------------------------------------------------------\
    \ config\n\n\ndef _truthy(value: str) -> bool:\n    return value.strip().lower()\
    \ in {\"1\", \"true\", \"yes\", \"on\"}\n\n\n@dataclass(frozen=True)\nclass Config:\n\
    \    \"\"\"Every field ``foo`` is read from ``TRE_REISSUE_FOO`` (see ``from_env``).\"\
    \"\"\n\n    listen_host: str = \"0.0.0.0\"\n    #: The pod's serving port (Service\
    \ targetPort, gateway target-pod, SM, probes).\n    listen_port: int = 8000\n\
    \    #: The local vLLM (moved to the internal port).\n    upstream_url: str =\
    \ \"http://127.0.0.1:8001\"\n    #: TRE gateway, in-cluster DNS name (env TRE_GATEWAY_URL).\n\
    \    gateway_url: str = DEFAULT_GATEWAY_URL\n    model: str = \"\"\n    #: This\
    \ pod's name (env POD_NAME, downward API): the x-tre-exclude-pod value.\n    pod_name:\
    \ str = \"\"\n    #: False = pure transparent proxy (still tracks sleep; never\
    \ retries / continues).\n    enabled: bool = True\n    #: Max retry / continuation\
    \ hops a request may take (x-tre-reissue-depth).\n    max_depth: int = 3\n   \
    \ #: Gateway attempts per retry or continuation request (503 / 502 / connect errors).\n\
    \    retry_attempts: int = 4\n    retry_backoff_s: float = 0.2\n    #: Cap of\
    \ the backoff and of an honoured Retry-After between attempts.\n    retry_max_backoff_s:\
    \ float = 2.0\n    #: Refuse /sleep and /pause without ``X-TRE-Hidden: 1`` (409).\n\
    \    require_hidden_header: bool = True\n    #: Context limit for chat continuations\
    \ without a token limit; 0 = ask vLLM\n    #: (GET /v1/models, cached).\n    max_model_len:\
    \ int = 0\n    probe_interval_s: float = 2.0\n    connect_timeout_s: float = 6.0\n\
    \    #: Total timeout of proxied control / metadata calls (/health, /metrics,\
    \ ...).\n    proxy_timeout_s: float = 60.0\n    #: Total timeout of /sleep, /pause,\
    \ /wake_up, /resume.\n    control_timeout_s: float = 300.0\n    client_max_size:\
    \ int = 64 * 1024 * 1024\n    # --- protocol names (defaults = vLLM >= 0.30 fork\
    \ + TRE gateway plugin) ---\n    completions_path: str = \"/v1/completions\"\n\
    \    chat_path: str = \"/v1/chat/completions\"\n    #: POSTs under this prefix\
    \ are retried when the engine is asleep.\n    retry_path_prefix: str = \"/v1/\"\
    \n    sleep_paths: tuple[str, ...] = (\"/sleep\", \"/pause\")\n    wake_paths:\
    \ tuple[str, ...] = (\"/wake_up\", \"/resume\")\n    is_sleeping_path: str = \"\
    /is_sleeping\"\n    models_path: str = \"/v1/models\"\n    metrics_path: str =\
    \ \"/tre-reissue/metrics\"\n    state_path: str = \"/tre-reissue/state\"\n   \
    \ hidden_header: str = \"X-TRE-Hidden\"\n    exclude_header: str = \"x-tre-exclude-pod\"\
    \n    continued_header: str = \"x-tre-continued\"\n    retried_header: str = \"\
    x-tre-retried\"\n    depth_header: str = \"x-tre-reissue-depth\"\n    #: Extension\
    \ field on the final (finish_reason) chunk of a continued stream.\n    continued_field:\
    \ str = \"tre_continued\"\n    #: Error type of the fork's 503 for requests reaching\
    \ a sleeping engine.\n    sleeping_error_type: str = \"EngineSleeping\"\n    #:\
    \ Abort chunk (stream): all generated token ids, in choices[i].\n    generated_ids_field:\
    \ str = \"generated_token_ids\"\n    #: Abort output: prompt token ids (chat:\
    \ top level; completions: in choices[i]).\n    prompt_ids_field: str = \"prompt_token_ids\"\
    \n    #: Aborted non-streaming response: generated token ids in choices[i].\n\
    \    token_ids_field: str = \"token_ids\"\n\n    @classmethod\n    def from_env(cls,\
    \ env: dict[str, str] | None = None) -> \"Config\":\n        env = dict(os.environ\
    \ if env is None else env)\n        values: dict[str, Any] = {}\n        for f\
    \ in dataclasses.fields(cls):\n            raw = env.get(\"TRE_REISSUE_\" + f.name.upper())\n\
    \            if f.name == \"gateway_url\":\n                raw = env.get(\"TRE_GATEWAY_URL\"\
    ) or raw\n            elif f.name == \"pod_name\":\n                raw = env.get(\"\
    POD_NAME\") or raw or env.get(\"HOSTNAME\")\n            if raw is None or raw\
    \ == \"\":\n                continue\n            default = f.default\n      \
    \      if isinstance(default, bool):\n                values[f.name] = _truthy(raw)\n\
    \            elif isinstance(default, int):\n                values[f.name] =\
    \ int(raw)\n            elif isinstance(default, float):\n                values[f.name]\
    \ = float(raw)\n            elif isinstance(default, tuple):\n               \
    \ values[f.name] = tuple(p.strip() for p in raw.split(\",\") if p.strip())\n \
    \           else:\n                values[f.name] = raw.strip()\n        cfg =\
    \ cls(**values)\n        cfg = dataclasses.replace(\n            cfg, upstream_url=cfg.upstream_url.rstrip(\"\
    /\"), gateway_url=cfg.gateway_url.rstrip(\"/\")\n        )\n        if cfg.max_depth\
    \ < 0 or cfg.retry_attempts < 1:\n            raise ValueError(\"TRE_REISSUE_MAX_DEPTH\
    \ must be >= 0 and TRE_REISSUE_RETRY_ATTEMPTS >= 1\")\n        if not cfg.gateway_url.startswith((\"\
    http://\", \"https://\")):\n            raise ValueError(f\"TRE_GATEWAY_URL must\
    \ be an http(s) URL, got {cfg.gateway_url!r}\")\n        return cfg\n\n\n# ---------------------------------------------------------------------------\
    \ metrics\n\n\nclass Histogram:\n    def __init__(self, buckets: tuple[float,\
    \ ...]) -> None:\n        self.buckets = buckets\n        self.counts = [0] *\
    \ len(buckets)\n        self.sum = 0.0\n        self.count = 0\n\n    def observe(self,\
    \ value: float) -> None:\n        self.sum += value\n        self.count += 1\n\
    \        for index, bound in enumerate(self.buckets):\n            if value <=\
    \ bound:\n                self.counts[index] += 1\n\n    def render(self, name:\
    \ str, labels: str) -> list[str]:\n        lines = [f'{name}_bucket{{{labels},le=\"\
    {b}\"}} {c}' for b, c in zip(self.buckets, self.counts)]\n        lines.append(f'{name}_bucket{{{labels},le=\"\
    +Inf\"}} {self.count}')\n        lines.append(f\"{name}_sum{{{labels}}} {self.sum:.6f}\"\
    )\n        lines.append(f\"{name}_count{{{labels}}} {self.count}\")\n        return\
    \ lines\n\n\nclass Metrics:\n    KINDS = (\"retry\", \"continue\", \"failed\"\
    , \"passthrough_abort\")\n\n    def __init__(self, model: str) -> None:\n    \
    \    self.model = model\n        self.reissue: dict[tuple[str, str], int] = {}\n\
    \        self.events: dict[str, int] = {}\n        self.overhead = Histogram(OVERHEAD_BUCKETS_S)\n\
    \        self.gap = Histogram(GAP_BUCKETS_S)\n\n    def count(self, kind: str,\
    \ reason: str) -> None:\n        key = (kind, reason)\n        self.reissue[key]\
    \ = self.reissue.get(key, 0) + 1\n\n    def total(self, kind: str) -> int:\n \
    \       return sum(v for (k, _), v in self.reissue.items() if k == kind)\n\n \
    \   def event(self, name: str) -> None:\n        self.events[name] = self.events.get(name,\
    \ 0) + 1\n\n    def render(self, state: \"SleepState\") -> str:\n        model\
    \ = _label(self.model)\n        lines = [\n            \"# HELP tre_reissue_total\
    \ Requests the sidecar retried, continued, failed to \"\n            \"save, or\
    \ passed an abort through for.\",\n            \"# TYPE tre_reissue_total counter\"\
    ,\n        ]\n        for (kind, reason), value in sorted(self.reissue.items()):\n\
    \            lines.append(f'tre_reissue_total{{model=\"{model}\",kind=\"{kind}\"\
    ,reason=\"{reason}\"}} {value}')\n        lines += [\n            \"# HELP tre_reissue_proxy_added_seconds\
    \ Sidecar time added before the upstream \"\n            \"request and before\
    \ the first response byte.\",\n            \"# TYPE tre_reissue_proxy_added_seconds\
    \ histogram\",\n        ]\n        lines += self.overhead.render(\"tre_reissue_proxy_added_seconds\"\
    , f'model=\"{model}\"')\n        lines += [\n            \"# HELP tre_reissue_gap_seconds\
    \ Abort to first continuation token.\",\n            \"# TYPE tre_reissue_gap_seconds\
    \ histogram\",\n        ]\n        lines += self.gap.render(\"tre_reissue_gap_seconds\"\
    , f'model=\"{model}\"')\n        lines += [\n            \"# HELP tre_reissue_events_total\
    \ Sidecar events (sleep rejections, state corrections, ...).\",\n            \"\
    # TYPE tre_reissue_events_total counter\",\n        ]\n        for name, value\
    \ in sorted(self.events.items()):\n            lines.append(f'tre_reissue_events_total{{model=\"\
    {model}\",event=\"{name}\"}} {value}')\n        lines += [\n            \"# HELP\
    \ tre_reissue_sleeping 1 while the local engine is (going to) sleep.\",\n    \
    \        \"# TYPE tre_reissue_sleeping gauge\",\n            f'tre_reissue_sleeping{{model=\"\
    {model}\"}} {1 if state.active else 0}',\n        ]\n        return \"\\n\".join(lines)\
    \ + \"\\n\"\n\n\ndef _label(value: str) -> str:\n    return value.replace(\"\\\
    \\\", \"\\\\\\\\\").replace('\"', '\\\\\"').replace(\"\\n\", \" \")\n\n\n# -----------------------------------------------------------------------------\
    \ state\n\n\nclass SleepState:\n    def __init__(self) -> None:\n        self.sleeping\
    \ = False\n        #: /sleep (/pause) calls in progress: the engine pauses at\
    \ their start.\n        self.pending = 0\n        #: /wake_up (/resume) calls\
    \ in progress.\n        self.waking = 0\n        #: Bumped on every transition;\
    \ an observed state is applied only if unchanged.\n        self.epoch = 0\n  \
    \      self.last_sleep: dict[str, Any] | None = None\n\n    def observe(self,\
    \ is_sleeping: bool, epoch: int) -> str | None:\n        \"\"\"Apply an engine\
    \ state observed while ``epoch`` was current. Returns the\n        correction\
    \ made (\"to_sleeping\" / \"to_awake\") or None.\"\"\"\n        if self.pending\
    \ or self.waking or self.epoch != epoch or bool(is_sleeping) == self.sleeping:\n\
    \            return None\n        self.sleeping = bool(is_sleeping)\n        self.epoch\
    \ += 1\n        return \"to_sleeping\" if self.sleeping else \"to_awake\"\n\n\
    \    @property\n    def active(self) -> bool:\n        return self.sleeping or\
    \ self.pending > 0\n\n\n# -----------------------------------------------------------------\
    \ pure helpers (SSE)\n\n\ndef split_events(buffer: bytes) -> tuple[list[bytes],\
    \ bytes]:\n    \"\"\"Complete SSE events (each including its blank-line terminator)\
    \ and the rest.\"\"\"\n    events: list[bytes] = []\n    start = 0\n    while\
    \ True:\n        index = buffer.find(b\"\\n\\n\", start)\n        if index < 0:\n\
    \            break\n        events.append(buffer[start : index + 2])\n       \
    \ start = index + 2\n    return events, buffer[start:]\n\n\ndef event_data(event:\
    \ bytes) -> bytes | None:\n    \"\"\"The joined ``data:`` payload of one event,\
    \ or None for a comment-only event.\"\"\"\n    if event.startswith(b\"data: \"\
    ) and event.count(b\"\\n\") == 2 and b\"\\r\" not in event:\n        return event[6:-2]\n\
    \    parts = []\n    for line in event.split(b\"\\n\"):\n        line = line.rstrip(b\"\
    \\r\")\n        if line.startswith(b\"data:\"):\n            value = line[5:]\n\
    \            parts.append(value[1:] if value.startswith(b\" \") else value)\n\
    \    return b\"\\n\".join(parts) if parts else None\n\n\ndef event_obj(event:\
    \ bytes) -> dict | None:\n    payload = event_data(event)\n    if payload is None\
    \ or payload.strip() == b\"[DONE]\":\n        return None\n    try:\n        obj\
    \ = json.loads(payload)\n    except ValueError:\n        return None\n    return\
    \ obj if isinstance(obj, dict) else None\n\n\ndef sse(obj: Any) -> bytes:\n  \
    \  return b\"data: \" + json.dumps(obj, ensure_ascii=False, separators=(\",\"\
    , \":\")).encode(\"utf-8\") + b\"\\n\\n\"\n\n\nSSE_DONE = b\"data: [DONE]\\n\\\
    n\"\n\n\ndef is_usage_only(obj: dict) -> bool:\n    return not obj.get(\"choices\"\
    ) and isinstance(obj.get(\"usage\"), dict)\n\n\ndef has_abort(obj: dict) -> bool:\n\
    \    return any(isinstance(c, dict) and c.get(\"finish_reason\") == \"abort\"\
    \ for c in obj.get(\"choices\") or ())\n\n\ndef finish_of(obj: dict) -> str |\
    \ None:\n    for choice in obj.get(\"choices\") or ():\n        if isinstance(choice,\
    \ dict) and choice.get(\"finish_reason\"):\n            return choice[\"finish_reason\"\
    ]\n    return None\n\n\ndef choice_text(choice: dict, chat: bool) -> str:\n  \
    \  if chat:\n        for key in (\"delta\", \"message\"):\n            part =\
    \ choice.get(key)\n            if isinstance(part, dict):\n                content\
    \ = part.get(\"content\")\n                return content if isinstance(content,\
    \ str) else \"\"\n        return \"\"\n    text = choice.get(\"text\")\n    return\
    \ text if isinstance(text, str) else \"\"\n\n\ndef events_text(blocks: \"deque[bytes]\
    \ | list[bytes]\", chat: bool) -> str:\n    parts: list[str] = []\n    for block\
    \ in blocks:\n        for event in split_events(block)[0]:\n            obj =\
    \ event_obj(event)\n            if obj is None:\n                continue\n  \
    \          for choice in obj.get(\"choices\") or ():\n                if isinstance(choice,\
    \ dict):\n                    parts.append(choice_text(choice, chat))\n    return\
    \ \"\".join(parts)\n\n\ndef is_sleeping_error(obj: Any, error_type: str) -> bool:\n\
    \    error = obj.get(\"error\") if isinstance(obj, dict) else None\n    return\
    \ isinstance(error, dict) and error.get(\"type\") == error_type\n\n\ndef stop_strings(body:\
    \ dict) -> list[str]:\n    stop = body.get(\"stop\")\n    if isinstance(stop,\
    \ str):\n        return [stop] if stop else []\n    if isinstance(stop, list):\n\
    \        return [s for s in stop if isinstance(s, str) and s]\n    return []\n\
    \n\ndef find_seam_stop(tail: str, text: str, stops: list[str], include: bool)\
    \ -> int | None:\n    \"\"\"Cut position in ``tail + text`` for the earliest stop\
    \ string that STARTS inside\n    ``tail`` (the end of the first segment's text)\
    \ and ends inside ``text`` (the\n    continuation), i.e. spans the seam; None\
    \ if there is none. Stops wholly inside\n    ``text`` are the continuation engine's\
    \ job (it has the same stop list).\"\"\"\n    combined = tail + text\n    best:\
    \ tuple[int, int] | None = None\n    for stop in stops:\n        start = combined.find(stop,\
    \ max(0, len(tail) - len(stop) + 1))\n        while start != -1 and start < len(tail):\n\
    \            if start + len(stop) > len(tail):\n                cut = start +\
    \ len(stop) if include else start\n                if best is None or start <\
    \ best[0]:\n                    best = (start, cut)\n                break\n \
    \           start = combined.find(stop, start + 1)\n    return None if best is\
    \ None else best[1]\n\n\ndef merged_usage(prompt_tokens: int, generated: int,\
    \ cont_usage: dict | None) -> dict:\n    \"\"\"Client-facing usage of a stitched\
    \ request: the ORIGINAL prompt, all completion\n    tokens of all segments (a\
    \ nested continuation's usage is already merged).\"\"\"\n    completion = int(generated)\
    \ + int((cont_usage or {}).get(\"completion_tokens\") or 0)\n    return {\"prompt_tokens\"\
    : int(prompt_tokens), \"completion_tokens\": completion,\n            \"total_tokens\"\
    : int(prompt_tokens) + completion}\n\n\ndef completion_chunk_as_chat(obj: dict,\
    \ *, stream: bool) -> dict:\n    \"\"\"A /v1/completions chunk (or response) reshaped\
    \ as a chat chunk (or response).\"\"\"\n    out = {k: v for k, v in obj.items()\
    \ if k != \"choices\"}\n    choices = []\n    for choice in obj.get(\"choices\"\
    ) or ():\n        entry: dict[str, Any] = {\"index\": choice.get(\"index\", 0)}\n\
    \        text = choice.get(\"text\") or \"\"\n        if stream:\n           \
    \ entry[\"delta\"] = {\"content\": text}\n        else:\n            entry[\"\
    message\"] = {\"role\": \"assistant\", \"content\": text}\n        entry[\"logprobs\"\
    ] = None\n        entry[\"finish_reason\"] = choice.get(\"finish_reason\")\n \
    \       if \"stop_reason\" in choice:\n            entry[\"stop_reason\"] = choice.get(\"\
    stop_reason\")\n        choices.append(entry)\n    out[\"choices\"] = choices\n\
    \    out[\"object\"] = \"chat.completion.chunk\" if stream else \"chat.completion\"\
    \n    return out\n\n\ndef _present(value: Any) -> bool:\n    return value is not\
    \ None\n\n\ndef _num_above(value: Any, limit: float) -> bool:\n    \"\"\"Present\
    \ and > limit; present but not a number counts as above (conservative).\"\"\"\n\
    \    if value is None:\n        return False\n    if isinstance(value, bool) or\
