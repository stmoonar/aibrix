apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsqwen-14b-nscc-ds-4a100-node10-gpu-2-3
  namespace: default
  labels:
    model.aibrix.ai/name: dsqwen-14b
    model.aibrix.ai/port: '8000'
    tre.aibrix.io/managed: 'true'
    tre.aibrix.io/node: nscc-ds-4a100-node10
    tre.aibrix.io/gpu-ids: 2-3
    tre.aibrix.io/routable: 'false'
  annotations: &id001
    tre.aibrix.io/gpu-ids: 2,3
    tre.aibrix.io/gpu-uuids: GPU-28af749d-4081-d7b6-0c14-cf9c29aa213d,GPU-76a392a5-b027-42be-fb8f-1bfe9079b47c
    tre.aibrix.io/state: hidden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsqwen-14b-nscc-ds-4a100-node10-gpu-2-3
  template:
    metadata:
      labels:
        model.aibrix.ai/name: dsqwen-14b
        model.aibrix.ai/port: '8000'
        tre.aibrix.io/managed: 'true'
        tre.aibrix.io/node: nscc-ds-4a100-node10
        tre.aibrix.io/gpu-ids: 2-3
        tre.aibrix.io/routable: 'false'
        app: dsqwen-14b-nscc-ds-4a100-node10-gpu-2-3
      annotations: *id001
    spec:
      nodeName: nscc-ds-4a100-node10
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
      - name: models-volume
        hostPath:
          path: /data
      initContainers:
      - name: tre-startup-gate
        image: vllm/vllm-openai:0.10.1-sleep
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - "import json, os, time, urllib.request\nurl = os.environ.get('TRE_SM_URL',\
          \ 'http://tre-v2-service-manager.tre-v2.svc.cluster.local:8000') + '/v2/startup/admit'\n\
          payload = json.dumps({'pod_name': os.environ['POD_NAME'], 'pod_uid': os.environ['POD_UID']}).encode()\n\
          while True:\n    try:\n        request = urllib.request.Request(url, data=payload,\
          \ headers={'Content-Type': 'application/json'}, method='POST')\n       \
          \ with urllib.request.urlopen(request, timeout=15) as response:\n      \
          \      if response.status == 200:\n                print(response.read().decode(),\
          \ flush=True)\n                break\n    except Exception as exc:\n   \
          \     print('TRE startup admission waiting:', exc, flush=True)\n    time.sleep(2)\n"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      containers:
      - name: vllm-openai
        image: vllm/vllm-openai:0.10.1-sleep
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --uvicorn-log-level
        - warning
        - --model
        - /data/nfs_shared_data/Models/DeepSeek-R1-Distill-Qwen-14B
        - --served-model-name
        - dsqwen-14b
        - --enable_sleep_mode
        - --tensor-parallel-size
        - '2'
        - --no-enable-prefix-caching
        - --max-num-seqs
        - '256'
        - --max-model-len
        - '12288'
        - --gpu-memory-utilization
        - '0.85'
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-28af749d-4081-d7b6-0c14-cf9c29aa213d,GPU-76a392a5-b027-42be-fb8f-1bfe9079b47c
        - name: CUDA_VISIBLE_DEVICES
          value: 0,1
        - name: VLLM_SERVER_DEV_MODE
          value: '1'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_USE_MODELSCOPE
          value: 'True'
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 300
        resources: {}
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: models-volume
          mountPath: /data
