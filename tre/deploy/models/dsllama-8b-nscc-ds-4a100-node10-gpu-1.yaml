apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsllama-8b-nscc-ds-4a100-node10-gpu-1
  namespace: default
  labels:
    model.aibrix.ai/name: dsllama-8b
    model.aibrix.ai/port: '8000'
    tre.aibrix.io/managed: 'true'
    tre.aibrix.io/node: nscc-ds-4a100-node10
    tre.aibrix.io/gpu-ids: '1'
    tre.aibrix.io/routable: 'false'
  annotations: &id001
    tre.aibrix.io/gpu-ids: '1'
    tre.aibrix.io/gpu-uuids: GPU-4bcbcb0c-7eaf-64a1-b3e5-b07cb81d3a96
    tre.aibrix.io/state: hidden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsllama-8b-nscc-ds-4a100-node10-gpu-1
  template:
    metadata:
      labels:
        model.aibrix.ai/name: dsllama-8b
        model.aibrix.ai/port: '8000'
        tre.aibrix.io/managed: 'true'
        tre.aibrix.io/node: nscc-ds-4a100-node10
        tre.aibrix.io/gpu-ids: '1'
        tre.aibrix.io/routable: 'false'
        app: dsllama-8b-nscc-ds-4a100-node10-gpu-1
      annotations: *id001
    spec:
      nodeName: nscc-ds-4a100-node10
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
      - name: models-volume
        hostPath:
          path: /data
      - name: tre-reissue-sidecar
        configMap:
          name: tre-reissue-sidecar
          defaultMode: 292
      initContainers:
      - name: tre-startup-gate
        image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - "import json, os, time, urllib.request\nurl = os.environ.get('TRE_SM_URL',\
          \ 'http://tre-v2-service-manager.tre-v2.svc.cluster.local:8000') + '/v2/startup/admit'\n\
          payload = json.dumps({'pod_name': os.environ['POD_NAME'], 'pod_uid': os.environ['POD_UID']}).encode()\n\
          while True:\n    try:\n        request = urllib.request.Request(url, data=payload,\
          \ headers={'Content-Type': 'application/json'}, method='POST')\n       \
          \ with urllib.request.urlopen(request, timeout=15) as response:\n      \
          \      if response.status == 200:\n                print(response.read().decode(),\
          \ flush=True)\n                break\n    except Exception as exc:\n   \
          \     print('TRE startup admission waiting:', exc, flush=True)\n    time.sleep(2)\n"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      containers:
      - name: vllm-openai
        image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --host
        - 127.0.0.1
        - --port
        - '8001'
        - --uvicorn-log-level
        - warning
        - --model
        - /data/nfs_shared_data/DeepSeek-R1-Distill-Llama-8B
        - --served-model-name
        - dsllama-8b
        - --enable_sleep_mode
        - --no-enable-prefix-caching
        - --max-num-seqs
        - '256'
        - --enable-chunked-prefill
        - --max-num-batched-tokens
        - '2048'
        - --gpu-memory-utilization
        - '0.85'
        - --sleep-reject-new
        - --abort-return-token-ids
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-4bcbcb0c-7eaf-64a1-b3e5-b07cb81d3a96
        - name: CUDA_VISIBLE_DEVICES
          value: '0'
        - name: VLLM_SERVER_DEV_MODE
          value: '1'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
          value: '75'
        resources: {}
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: models-volume
          mountPath: /data
      - name: tre-reissue-sidecar
        image: vllm-openai-tre:0.30.0-ts-8dc0f2a7
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /opt/tre-reissue/sidecar.py
        env:
        - name: TRE_REISSUE_LISTEN_PORT
          value: '8000'
        - name: TRE_REISSUE_UPSTREAM_URL
          value: http://127.0.0.1:8001
        - name: TRE_GATEWAY_URL
          value: http://tre-gateway.envoy-gateway-system.svc.cluster.local:80
        - name: TRE_REISSUE_MODEL
          value: dsllama-8b
        - name: TRE_REISSUE_MAX_DEPTH
          value: '3'
        - name: TRE_REISSUE_RETRY_ATTEMPTS
          value: '4'
        - name: TRE_REISSUE_UPSTREAM_KEEPALIVE_S
          value: '2'
        - name: TRE_REISSUE_UPSTREAM_SERVER_KEEPALIVE_S
          value: '75'
        - name: TRE_REISSUE_LOCAL_RECONNECT_ATTEMPTS
          value: '1'
        - name: TRE_REISSUE_LOCAL_RECONNECT_WINDOW_S
          value: '1'
        - name: TRE_REISSUE_SERVER_KEEPALIVE_S
          value: '75'
        - name: TRE_REISSUE_GATEWAY_UPSTREAM_IDLE_S
          value: '60'
        - name: TRE_REISSUE_REQUIRE_HIDDEN_HEADER
          value: 'true'
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NVIDIA_VISIBLE_DEVICES
          value: void
        - name: PYTHONUNBUFFERED
          value: '1'
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 300
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: '2'
            memory: 1Gi
        volumeMounts:
        - name: tre-reissue-sidecar
          mountPath: /opt/tre-reissue
          readOnly: true
