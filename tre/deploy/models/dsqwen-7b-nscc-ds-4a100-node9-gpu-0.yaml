apiVersion: apps/v1
kind: Deployment
metadata:
  name: dsqwen-7b-nscc-ds-4a100-node9-gpu-0
  namespace: default
  labels:
    model.aibrix.ai/name: dsqwen-7b
    model.aibrix.ai/port: '8000'
    tre.aibrix.io/managed: 'true'
    tre.aibrix.io/node: nscc-ds-4a100-node9
    tre.aibrix.io/gpu-ids: '0'
    tre.aibrix.io/routable: 'false'
  annotations: &id001
    tre.aibrix.io/gpu-ids: '0'
    tre.aibrix.io/gpu-uuids: GPU-689a3e93-68db-0dac-160b-6a791cf246e8
    tre.aibrix.io/state: hidden
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dsqwen-7b-nscc-ds-4a100-node9-gpu-0
  template:
    metadata:
      labels:
        model.aibrix.ai/name: dsqwen-7b
        model.aibrix.ai/port: '8000'
        tre.aibrix.io/managed: 'true'
        tre.aibrix.io/node: nscc-ds-4a100-node9
        tre.aibrix.io/gpu-ids: '0'
        tre.aibrix.io/routable: 'false'
        app: dsqwen-7b-nscc-ds-4a100-node9-gpu-0
      annotations: *id001
    spec:
      nodeName: nscc-ds-4a100-node9
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 20Gi
      - name: models-volume
        hostPath:
          path: /data
      initContainers:
      - name: tre-startup-gate
        image: vllm/vllm-openai:0.10.1-sleep
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -c
        - "import json, os, time, urllib.request\nurl = os.environ.get('TRE_SM_URL',\
          \ 'http://tre-v2-service-manager.tre-v2.svc.cluster.local:8000') + '/v2/startup/admit'\n\
          payload = json.dumps({'pod_name': os.environ['POD_NAME'], 'pod_uid': os.environ['POD_UID']}).encode()\n\
          while True:\n    try:\n        request = urllib.request.Request(url, data=payload,\
          \ headers={'Content-Type': 'application/json'}, method='POST')\n       \
          \ with urllib.request.urlopen(request, timeout=15) as response:\n      \
          \      if response.status == 200:\n                print(response.read().decode(),\
          \ flush=True)\n                break\n    except Exception as exc:\n   \
          \     print('TRE startup admission waiting:', exc, flush=True)\n    time.sleep(2)\n"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
      containers:
      - name: vllm-openai
        image: vllm/vllm-openai:0.10.1-sleep
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - -m
        - vllm.entrypoints.openai.api_server
        - --host
        - 0.0.0.0
        - --port
        - '8000'
        - --uvicorn-log-level
        - warning
        - --model
        - /data/nfs_shared_data/DeepSeek-R1-Distill-Qwen-7B
        - --served-model-name
        - dsqwen-7b
        - --enable_sleep_mode
        - --no-enable-prefix-caching
        - --max-num-seqs
        - '256'
        - --enable-chunked-prefill
        - --max-num-batched-tokens
        - '2048'
        - --swap-space
        - '16'
        - --gpu-memory-utilization
        - '0.85'
        env:
        - name: NVIDIA_VISIBLE_DEVICES
          value: GPU-689a3e93-68db-0dac-160b-6a791cf246e8
        - name: CUDA_VISIBLE_DEVICES
          value: '0'
        - name: VLLM_SERVER_DEV_MODE
          value: '1'
        - name: VLLM_WORKER_MULTIPROC_METHOD
          value: spawn
        - name: VLLM_USE_MODELSCOPE
          value: 'True'
        ports:
        - containerPort: 8000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 300
        resources: {}
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
        - name: models-volume
          mountPath: /data
