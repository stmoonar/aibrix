# Per-model circuit breakers for the APA / experiment-3 control-arm data path
# (traffic: NodePort 31592 -> Gateway aibrix-system/aibrix-eg -> per-model
# HTTPRoute -> model Service in default ns).
#
# WHY (t1 diagnosis, 2026-07): under the tight load t1, 45902 reqs / 49.6% got
# 503; envoy access log showed 10309/10310 of them were response_flags=UF +
# upstream_reset_before_response_started{local_connection_failure|
# socket_creation_failure}: envoy could not create the upstream socket. Root
# cause = the shared envoy container has RLIMIT_NOFILE soft=1024 (see
# envoyproxy-nofile-patch.yaml), AND each model cluster had NO connection cap
# (Envoy default max_connections/max_pending/max_requests = 1024 PER cluster,
# only max_retries was set). The saturated model's long requests (p50 9s /
# p99 34s) pile up HTTP/1.1 upstream connections (1 conn per in-flight req);
# with 3 clusters sharing one 1024-fd budget the pool is exhausted globally, so
# socket creation fails for EVERY model -- an innocent model (14b, 6rps) took
# 47% collateral 503s.
#
# FIX: give each model cluster its own bounded quota. Overload now fast-fails as
# 503 UO (overflow, returned in ms before any socket attempt) confined to the
# saturated model, instead of UF socket_creation_failure that spreads across all
# models. This is per-model isolation, not a promise that tight load all
# succeeds (the physically-impossible part still fails -- but cleanly).
#
# SIZING (revised 2026-09-21): cap = ceiling, not steady target. The original
# 256/64 was sized against an assumed RLIMIT_NOFILE of 1024 (3x256=768 upstream
# conns). The fd raise in envoyproxy-nofile-patch.yaml is live on BOTH envoy
# pods -- /proc/1/limits reports 65536 soft and hard, with ~414 fds in use at
# idle -- so the old ceiling was two orders of magnitude below what the proxy
# can hold, and it, not vLLM, was the admission controller.
#
# WHY IT MOVED: at 256+64 the cap is per Envoy CLUSTER, shared by every replica
# of a model, so it does not grow when TRE scales out. Calibration fitted
# theta_m against that ceiling and mistook it for capacity, and in E1 a large
# share of the 58907 errors were Envoy shed rather than real SLO failures.
#
# WHY IT MUST MATCH THE TRE ARM: this file governs the APA / control arm
# (NodePort 31592) and backendtrafficpolicy-tre-v2.yaml governs the TRE arm
# (NodePort 31094). A/B results are only interpretable if both arms admit
# traffic under identical rules -- otherwise "TRE served more" can just mean
# "APA was shed sooner". Keep the two files numerically identical; change them
# together or not at all.
#
# NEW VALUES: maxConnections/maxParallelRequests 4096, maxPendingRequests 1024,
# maxParallelRetries 16 (unchanged; caps retry amplification). Aggregate
# ceiling 3x4096=12288 upstream conns sits well inside the 65536 fd budget.
# Real admission control now lives where it belongs: vLLM --max-num-seqs 256
# per replica, which DOES scale with replica count.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dsqwen-7b-circuitbreaker
  namespace: aibrix-system
  labels:
    tre.aibrix.io/managed: 'true'
    tre.aibrix.io/purpose: gateway-hardening
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: dsqwen-7b-router
  circuitBreaker:
    maxConnections: 4096
    maxPendingRequests: 1024
    maxParallelRequests: 4096
    maxParallelRetries: 16
---
