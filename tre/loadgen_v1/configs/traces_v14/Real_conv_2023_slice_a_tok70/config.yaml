custom_load_test:
  duration_seconds: 720
  gateway_endpoint: http://localhost:8888
  generate_mode: real_trace
  output:
    base_dir: ./output/trace_v14
    sub_dir_name: Real_conv_2023_slice_a_tok70
    files:
      load_timeline_rps: load_timeline_rps.json
      load_timeline_token_rate: load_timeline_token_rate.json
      trace_data: traces.json
      trace_plots: traces.png
      performance_metrics: performance_metrics.json
      performance_plots: plot_analysis/
  random_seed: 9804
  client:
    api_key: dummy
    timeout: 300.0
    enable_streaming: true
    log_level: INFO
    routing_algorithm: least-gpu-cache
    process_count: 8
    max_coroutines_per_process: 100
    task_batch_window: 5.0
    load_monitor_interval: 1.0
  models:
  - name: dsllama-8b
    modelscope_url: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    real_trace_file: real_traces/dsllama-8b.json
    max_tokens: 500
  - name: dsqwen-7b
    modelscope_url: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    real_trace_file: real_traces/dsqwen-7b.json
    max_tokens: 495
  - name: dsqwen-14b
    modelscope_url: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B
    real_trace_file: real_traces/dsqwen-14b.json
    max_tokens: 510
  real_trace_config:
    time_scale: 1.0
    max_duration: 720
  load_mode: rps
  total_load: 27
  stable_period:
    min_duration: 30
    max_duration: 60
  transition_period:
    min_duration: 2
    max_duration: 5
  noise:
    enabled: false
  input_token_config:
    min_length: 50
    max_length: 3000
    distribution: normal
    mean: 500
    std: 200
  analysis:
    percentiles:
    - 50
    - 70
    - 90
    - 99

