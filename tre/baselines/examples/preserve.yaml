# PreServe-oracle baseline parameters (TRE_BL_POLICY=preserve, TRE_BL_POLICY_CONFIG=<this file>).
# Tier-1 uses the replayed trace plus noise (an oracle), not the paper's mLSTM: disclose.
# See tre_baselines/policies/preserve.py for the full table (paper vs ours).

# --- Tier-1 (window-level provisioning, paper §4.1 / Alg.2) ---
# The trace the campaign replays, as mounted in the shell pod (read once at start): the
# deployment's `traces` volume is mounted at /etc/tre-baselines-traces (an emptyDir until
# patched, see README "Trace volume"); traces shipped in the image live under
# /app/tre/replayer/traces_*. The replay marker tre:v2:bl:replay_t0 must name the same
# trace (last trace_match_parts path components equal), otherwise Tier-1 stays inactive.
trace_path: /etc/tre-baselines-traces/case/trace.json   # replace with the run's trace
trace_seed: 0            # = the replay's --seed (segment traces are re-scheduled from it)
trace_schedule: poisson  # what tre_replayer.run_trace sends
trace_match_parts: 2
window_s: 600            # paper: 10 min (main runs; a 720 s trace fires Tier-1 twice: disclose).
                         # sensitivity: 60
lead_s: 0
tier1: oracle_noisy      # oracle_noisy | oracle | last_window
# noise_sigma: 0.0772    # default: lognormal sigma with mean APE 6.17 % (paper Table 1); sensitivity: 0.30
# Per-replica serving capability, tok/s (tools/preserve_mu.py over a calibration capture).
# Required for every managed model: the policy refuses to start without it.
mu:
  dsqwen-7b: {p: 0.0, d: 0.0, t: 0.0}    # placeholders: fill from preserve_mu output
  dsllama-8b: {p: 0.0, d: 0.0, t: 0.0}
  dsqwen-14b: {p: 0.0, d: 0.0, t: 0.0}

# --- Tier-2 (in-window, per pod, paper §4.3.1 / §4.3.2) ---
# max_output_len: 4096   # default: the trace's largest max_tokens per model, else 4096
map_factor: 1.2          # ring length = ceil(max_output_len * map_factor)
lookahead_iters: 100     # paper l
kv_high: 0.95            # paper
overload_frac: 0.10      # paper
t_f: 0.30                # paper T_f
out_len_is_upper_bound: true  # ours: max_tokens is a hard cap in vLLM -> no virtual extension
ext_frac: 0.2            # paper virtual extension (only used when out_len_is_upper_bound: false)
# kv_capacity_tokens: {dsqwen-7b: 100000}   # only if a pod lacks vllm:cache_config_info
kv_agree_tol: 0.15       # ours: Tier-2 scale-down needs |U[0] - engine KV usage| <= this per pod
hold_mode: target        # target | awake
req_ttl_s: 1800          # ours: GC of arr/done bookkeeping only (a request leaves the map on done)
