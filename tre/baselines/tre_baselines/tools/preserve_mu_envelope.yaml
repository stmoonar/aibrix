# Input of `python3 -m tre_baselines.tools.preserve_eval_envelope --config <this file> --data-root <root> --out <dir>`:
# the shape envelope of the PreServe mu calibration (user 2026-11-04). preserve_mu alg1 keeps a dataset window
# only if its arrived requests' shape lies inside the envelope file named by `default` (alg1 config
# `envelope_default`; a / b only as sensitivity rows, alg1 --envelope-variant).
#   a = P share [min, max]   b = P share [p5, p95]   c = mean input and mean output length each [min, max]
# of the evaluation traces' 10 s arrival windows, per model.
window_s: 10
default: c                  # -> envelope_c.yaml, name lengths-minmax

# The evaluation trace set: the 7 traces of eval/runner/campaigns/campaign-bl-w10-preserve-20261103.yaml (seed 1),
# dirs relative to --data-root, sha256 of <set>/<trace>/<trace_file> (the tool refuses another file).
trace_file: seed1/traces_tre.effective.json
# A request without max_output_tokens gets the max_tokens of its model in the trace's loadgen config (relative to
# the tre/ tree; = the campaign spec's loadgen_config_root), the value the replayer sends.
